services:
  - type: web
    name: daka-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Set the value in the Render dashboard (Environment tab) — do NOT commit the key.
      - key: OPENAI_API_KEY
        sync: false
