    function loadCaptured(url) {
      if (capturedURL && capturedURL.startsWith('blob:')) URL.revokeObjectURL(capturedURL);
      capturedURL = url;
      capturedImg = new Image();
      capturedImg.src = url;
      $('resultPhoto').src = url;
    }

    /* ── Backend ── */
    async function postScan(path, blob, fields) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      try {
        const fd = new FormData();
        fd.append('file', blob, 'photo.jpg');
        for (const [k, v] of Object.entries(fields || {})) fd.append(k, v);
        const res = await fetch(API + path, { method: 'POST', body: fd, signal: controller.signal });
        let data; try { data = await res.json(); } catch (e) { throw new Error(tr('err.badResponse')); }
        if (!res.ok) throw new Error(data.error || data.message || data.detail || (tr('err.server') + ' (' + res.status + ')'));
        if (data.error) throw new Error(data.error);
        return data;
      } finally { clearTimeout(timer); }
    }

    // The file picker has no coaching to get on with, so it still takes both halves at once.
    async function postAnalyze(blob) {
      const data = await postScan('/analyze', blob, { lang });
      if (!data.lighting) throw new Error(tr('err.badResponse'));
      return data;
    }

    /* ── Stage 1: scan the scene ── */
    // Rising count, so a response that arrives after the user has rescanned is thrown away rather
    // than painted over the scene they are now pointing at.
    let scanToken = 0;

    // Two requests, not one. The marker comes out of /measure in well under a second; /describe
    // takes a vision call, which measured between 3.7 and 11.1 seconds for the same image. Waiting
    // on the second to show the first meant standing with your arm up for a scene name.
    //
    // Nothing needs a placeholder while the words are missing. The hint hides itself when empty,
    // the hashtag card is not rendered without tags, and the filter already defaults to Vivid —
    // all of it built for the model failing, which is the same state as the model being slow.
    async function scanScene() {
      const blob = await grabScanBlob();
      if (!blob) { toast(tr('toast.notReady')); return; }
      const token = ++scanToken;
      setCamState('loading');
      try {
        const measured = await postScan('/measure', blob);
        if (token !== scanToken) return;
        if (measured.lighting && measured.lighting.quality === 'Poor') { openGate(tr('gate.light')); return; }
        if (measured.blurry) { openGate(tr('gate.blur')); return; }
        analysisResult = measured;
        beginCoaching(analysisResult);
        describeScene(blob, measured, token);
      } catch (e) {
        setCamState('idle');
        toast(errMsg(e));
      }
    }

    // Deliberately not awaited. A failure here costs the scene name and the hint; the marker and
    // every cue are already on screen and keep working, which is the whole point of the split.
    function describeScene(blob, measured, token) {
      const x = (measured.placement && measured.placement.x != null) ? measured.placement.x : 0.667;
      postScan('/describe', blob, { lang, side: x < 0.5 ? 'left' : 'right' })
        .then(described => {
          if (token !== scanToken || !analysisResult) return;
          Object.assign(analysisResult, described);
          renderTips(analysisResult);
          // The hint arriving grows the controls bar, and the frame is centred above it.
          resizeControls($('camControls').getBoundingClientRect().height);
        })
        .catch(() => { /* the scan is still usable without the words */ });
    }

    function beginCoaching(r) {
      renderTips(r);

      // Where the subject should stand; fall back to a plain rule-of-thirds point. != null, not
      // truthiness: a legitimate 0 coordinate must not fall through to the default.
      const p = r.placement;
      standPos = (p && p.x != null && p.y != null) ? { x: p.x, y: p.y } : { x: 1/3, y: 0.88 };
      standReason = (p && p.reason) ? trOr('reason.' + p.reason, p.reason_text || '')
                                    : ((p && p.reason_text) || '');

      // camera_tilt is advisory: only cue when the engine actually found dead space AND gave
      // wording for it.
      const tilt = r.camera_tilt;
      const hasTilt = !!(tilt && tilt.direction && tilt.direction !== 'ok' && tilt.reason);
      tiltDirection = hasTilt ? tilt.direction : null;
      tiltFallback = hasTilt ? tilt.reason : '';

      // composition.horizon describes the SCANNED frame, not the phone right now — so it only opens
      // the prompt.
      const horizon = (r.composition || {}).horizon;
      needsStraightening = motionGranted && !!horizon && horizon !== 'Level';

      coachingActive = true;
      $('coachCue').classList.add('show');
      setCue(tr('cue.inFrame'));
      setCamState('tips');
    }

    async function retake() {
      if (!analysisResult) return;
      show('camera');
      // Before startLive, not after: a suspended element reports videoWidth 0 and every frame of
      // the loop would return early until it happened to resume on its own.
      if (await resumeCamera() === 'reacquired' && !hasCamera) return;   // camera is gone for good
      startLive();
      beginCoaching(analysisResult);
    }

    function renderTips(r) {
      $('sceneBadgeTop').textContent = r.scene_type || '';
      // Depth is the thing a flat marker cannot show: it says WHERE across the frame but nothing
      // about how far into the scene to stand.
      $('placeHint').textContent = r.placement_hint || '';
    }

    /* ── Stage 2: take the keeper photo → results ── */
    async function takePhoto() {
      const url = await grabKeeperURL();
      if (!url) { toast(tr('toast.notReady')); return; }
      loadCaptured(url);
      stopLive();
      renderResults(analysisResult);
      show('results');
    }

    function renderResults(r) {
      currentFilter = FILTER_CSS[r.filter] ? r.filter : 'Vivid';
      filterActive = true;
      buildFilterStrip(currentFilter);
      updateFilterUI();
      $('sceneBadge').textContent = r.scene_type || tr('res.scene');
      const pills = (r.hashtags || []).map(h => '<div class="pill" data-tag="' + esc(h) + '">' + esc(h) + '</div>').join('');
      $('cards').innerHTML = pills
        ? '<div class="card"><div class="card-title">' + esc(tr('res.hashtags')) + ' <span class="ch">' + esc(tr('res.tapToCopy')) + '</span></div><div class="pills">' + pills + '</div><div class="copy-all" id="copyAll">' + esc(tr('res.copyAll')) + '</div></div>'
        : '';
      $('cards').querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => copyText(p.dataset.tag, tr('toast.copied'))));
      const ca = $('copyAll');
      if (ca) ca.addEventListener('click', () => copyText((r.hashtags || []).join(' '), tr('toast.allCopied')));
    }

    /* ── Filter toggle ── */
    // "Original" is first and is a real option, not an absence — turning the filter off should be
    // as easy as turning it on, and the strip is the only place that choice now lives.
    const NO_FILTER = 'Original';
    // Bottom strip of the viewfinder occupied by the cue pill: 16px offset plus its height.
    const CUE_RESERVED_PX = 60;

    function buildFilterStrip(recommended) {
      const strip = $('filterStrip');
      strip.innerHTML = '';
      for (const name of [NO_FILTER, ...Object.keys(FILTER_CSS)]) {
        const opt = document.createElement('button');
        opt.className = 'filter-opt' + (name === recommended ? ' pick' : '');
        opt.textContent = filterLabel(name);
        opt.dataset.filter = name;
        opt.addEventListener('click', () => {
          filterActive = name !== NO_FILTER;
          if (filterActive) currentFilter = name;
          updateFilterUI();
        });
        strip.appendChild(opt);
      }
    }

    function updateFilterUI() {
      $('resultPhoto').style.filter = filterActive ? FILTER_CSS[currentFilter] : '';
      const selected = filterActive ? currentFilter : NO_FILTER;
      $('filterStrip').querySelectorAll('.filter-opt').forEach(
        (o) => o.classList.toggle('on', o.dataset.filter === selected));
      $('saveBtn').textContent = filterActive ? tr('res.saveFiltered') : tr('res.save');
    }

    /* ── Pixel-baked filters (match preview exactly) ── */
    function applyFilters(d, css) {
      const re = /([\w-]+)\(([^)]+)\)/g; let m;
      while ((m = re.exec(css))) {
        if (m[1] === 'url') { tint(d, TINT[m[2]] || 0); continue; }
        const v = parseFloat(m[2]);
        if (m[1] === 'brightness') brightness(d, v);
        else if (m[1] === 'saturate') saturate(d, v);
        else if (m[1] === 'contrast') contrast(d, v);
        else if (m[1] === 'sepia') sepia(d, v);
        else if (m[1] === 'hue-rotate') hueRotate(d, v);
        else if (m[1] === 'grayscale') grayscale(d, v);
      }
    }
    // The baked twin of the SVG colour matrices above: scale red one way, blue the other.
    function tint(d, k) {
      if (!k) return;
      const r = 1 + k, b = 1 - k;
      for (let i = 0; i < d.length; i += 4) { d[i] *= r; d[i + 2] *= b; }
    }
    function brightness(d, v) { for (let i = 0; i < d.length; i += 4) { d[i]*=v; d[i+1]*=v; d[i+2]*=v; } }
    function contrast(d, v) { for (let i = 0; i < d.length; i += 4) { d[i]=(d[i]-128)*v+128; d[i+1]=(d[i+1]-128)*v+128; d[i+2]=(d[i+2]-128)*v+128; } }
    function saturate(d, v) { for (let i = 0; i < d.length; i += 4) { const l=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; d[i]=l+(d[i]-l)*v; d[i+1]=l+(d[i+1]-l)*v; d[i+2]=l+(d[i+2]-l)*v; } }
    function sepia(d, a) { const n=1-a; for (let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2]; d[i]=n*r+a*(0.393*r+0.769*g+0.189*b); d[i+1]=n*g+a*(0.349*r+0.686*g+0.168*b); d[i+2]=n*b+a*(0.272*r+0.534*g+0.131*b); } }
    function grayscale(d, a) { const n=1-a; for (let i=0;i<d.length;i+=4){ const gr=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; d[i]=n*d[i]+a*gr; d[i+1]=n*d[i+1]+a*gr; d[i+2]=n*d[i+2]+a*gr; } }
    function hueRotate(d, deg) {
      const r=deg*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
      const m0=0.213+c*0.787-s*0.213, m1=0.715-c*0.715-s*0.715, m2=0.072-c*0.072+s*0.928;
      const m3=0.213-c*0.213+s*0.143, m4=0.715+c*0.285+s*0.140, m5=0.072-c*0.072-s*0.283;
      const m6=0.213-c*0.213-s*0.787, m7=0.715-c*0.715+s*0.715, m8=0.072+c*0.928+s*0.072;
      for (let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2]; d[i]=R*m0+G*m1+B*m2; d[i+1]=R*m3+G*m4+B*m5; d[i+2]=R*m6+G*m7+B*m8; }
    }

    /* ── Save / share ── */
    // Bakes the chosen filter into the pixels, because CSS filters are a preview only — the file
    // itself has to carry them.
    function bakeBlob() {
      return new Promise(resolve => {
        const cv = document.createElement('canvas');
        cv.width = capturedImg.naturalWidth; cv.height = capturedImg.naturalHeight;
        const ctx = cv.getContext('2d');
        ctx.drawImage(capturedImg, 0, 0);
        if (filterActive && FILTER_CSS[currentFilter]) {
          const id = ctx.getImageData(0, 0, cv.width, cv.height);
          applyFilters(id.data, FILTER_CSS[currentFilter]);
          ctx.putImageData(id, 0, 0);
        }
        cv.toBlob(b => resolve(b), 'image/jpeg', 0.95);
      });
    }
    function filename() {
      // Dated, because a folder full of daka.jpg, daka(1).jpg is nobody's idea of a keeper — but
      // spaced and punctuated like a screenshot rather than run together as digits, which read as a
      // serial number.
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      const day = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
      // Dots, not colons: a colon is illegal in a filename on every platform that matters.
      const time = `${p(d.getHours())}.${p(d.getMinutes())}.${p(d.getSeconds())}`;
      return `DaKaBa ${day} ${time}.jpg`;
    }

    const canShareFile = (file) => !!(navigator.canShare && navigator.canShare({ files: [file] }));

    async function sharePhoto() {
      if (!capturedImg) return;
      const blob = await bakeBlob();
      const tags = (analysisResult && analysisResult.hashtags || []).join(' ');
      const file = new File([blob], filename(), { type: 'image/jpeg' });
      if (canShareFile(file)) {
        // Before share(), not after: the clipboard write needs the user gesture that is still live
        // here, and awaiting share() first spends it on the sheet.
        if (tags) await copyText(tags, tr('toast.tagsCopied'));
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      downloadPhoto(blob);   // no share support (most desktops) — saving is the useful thing left
    }

    // No web page can write to the camera roll on either mobile OS.
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(',')[1] || '');
        r.onerror = () => reject(r.error || new Error('unreadable'));
        r.readAsDataURL(blob);
      });
    }
    const savePlugin = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SavePhoto) || null;

    async function savePhoto() {
      if (!capturedImg) return;
      const blob = await bakeBlob();

      // Inside the native shell, Save means save: straight to the camera roll, one tap, no sheet.
      const sp = savePlugin();
      if (sp && sp.save) {
        try {
          await sp.save({ data: await blobToBase64(blob) });
          toast(tr('toast.saved'));
          return;
        } catch (e) {
          console.warn('camera roll save failed, falling back to the sheet:', e);
        }
      }

      const file = new File([blob], filename(), { type: 'image/jpeg' });
      if (canShareFile(file)) {
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      downloadPhoto(blob);
    }

    // Desktop only, and the one path where "Saved" is a true statement — a browser that reaches
    // here has a real filesystem and honours the download attribute.
    function downloadPhoto(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(tr('toast.saved'));
    }
    async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch (e) { toast(tr('toast.copyFail')); } }

    /* ── File fallback (no live camera): analyse → results directly ── */
    $('fileInput').addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => loadCaptured(reader.result);
      reader.readAsDataURL(f);
      $('camLoading').classList.add('active'); show('camera');
      try {
        analysisResult = await postAnalyze(f);
        renderResults(analysisResult);
        show('results');
      } catch (err) { toast(errMsg(err)); show('home'); }
      finally { $('camLoading').classList.remove('active'); }
    });

    /* ── Light / dark ── */
    const THEMES = ['light', 'dark'];
    let theme = (() => {
      try {
        const saved = localStorage.getItem('daka.theme');
        if (THEMES.indexOf(saved) !== -1) return saved;
      } catch (e) { /* storage unavailable — auto for this session */ }
      return null;                      // null = follow the phone
    })();

    function applyTheme(next) {
      if (next && THEMES.indexOf(next) !== -1) {
        theme = next;
        try { localStorage.setItem('daka.theme', theme); } catch (e) { /* choice lasts the session */ }
      }
      const root = document.documentElement;
      if (root) {
        if (theme) root.dataset.theme = theme;
        else delete root.dataset.theme;
      }
      document.querySelectorAll('.theme-opt').forEach(
        o => o.classList.toggle('on', o.dataset.themeChoice === theme));
      // The two theme-color metas are media-scoped, so they answer to the OS rather than to this
      // choice.
      if (theme) {
        document.querySelectorAll('meta[name="theme-color"]').forEach((m, i) => {
          m.removeAttribute('media');
          m.setAttribute('content', theme === 'dark' ? '#14110D' : '#F6F1E9');
          if (i > 0) m.remove();
        });
      }
    }
    document.querySelectorAll('.theme-opt').forEach(
      o => o.addEventListener('click', () => applyTheme(o.dataset.themeChoice)));
    applyTheme();

    /* ── Language switch ── */
    function applyLang(next) {
      if (next && LANGS.indexOf(next) !== -1) {
        lang = next;
        try { localStorage.setItem('daka.lang', lang); } catch (e) { /* choice lasts this session */ }
      }
      // documentElement so assistive tech and the font stack follow the text, not just the label.
      if (document.documentElement) document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : 'en');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
      document.querySelectorAll('.lang-opt').forEach(
        o => o.classList.toggle('on', o.dataset.lang === lang));
      // The filter strip is built once per photo, so it needs rebuilding by hand — unlike the cue,
      // which is rewritten on the next frame anyway.
      if (capturedImg) { buildFilterStrip((analysisResult || {}).filter); updateFilterUI(); }
    }
    document.querySelectorAll('.lang-opt').forEach(
      o => o.addEventListener('click', () => applyLang(o.dataset.lang)));
    applyLang();

    /* ── Wire up ── */
    /* ── Tip jar (native only) ──
       Nothing is gated. Every scan costs two OpenAI calls, and the tip is the only ask. */
    // A RevenueCat Test Store key: it runs the whole purchase flow — offerings, paywall,
    // entitlements — without App Store Connect or a paid developer account, which is what makes a
    // working tip jar demonstrable at all before a store release exists.
    let RC_API_KEY = 'test_yIDmpHCJqdCeflZkqQMdrPyMdsy';

    const native = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    const rcPlugin = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Purchases) || null;
    const rcUI = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RevenueCatUI) || null;
    let tipPackages = [];
    let tipOffering = null;
    let tipPackage = null;      // the one we actually sell: product "tip", else the lifetime package

    // The tip is a one-off, so it is a lifetime package in RevenueCat's model.
    function pickTipPackage(pkgs) {
      const byProduct = pkgs.find(p => p.product && p.product.identifier === 'tip');
      if (byProduct) return byProduct;
      const lifetime = pkgs.find(p => p.packageType === 'LIFETIME' || p.identifier === '$rc_lifetime');
      return lifetime || pkgs[0] || null;
    }

    async function initTipJar() {
      const rc = rcPlugin();
      if (!native() || !rc || !RC_API_KEY) return;
      try {
        await rc.configure({ apiKey: RC_API_KEY });
        const { current } = await rc.getOfferings();
        // Only show the button once RevenueCat has answered with something buyable.
        tipPackages = (current && current.availablePackages) || [];
        tipOffering = current || null;
        tipPackage = pickTipPackage(tipPackages);
        if (tipPackage) $('tipBtn').hidden = false;

        if (rc.addCustomerInfoUpdateListener) {
          rc.addCustomerInfoUpdateListener((info) => {
            const bought = info && info.customerInfo
              && info.customerInfo.nonSubscriptionTransactions
              && info.customerInfo.nonSubscriptionTransactions.length;
            if (bought) $('tipBtn').textContent = tr('tip.supporter');
          });
        }
      } catch (e) {
        console.warn('tip jar unavailable:', e);
      }
    }

    // RevenueCat's own paywall first, our sheet second. presentPaywall returns NOT_PRESENTED
    // whenever no paywall has been designed in the dashboard — which is the state this project is
    // in until someone builds one, and may stay the state on a Test Store offering.
    const hasPaywall = (o) => !!(o && (o.paywall || o.paywallComponents));

    async function openTip() {
      const ui = rcUI();
      if (ui && ui.presentPaywall && hasPaywall(tipOffering)) {
        try {
          const res = await ui.presentPaywall({ offering: tipOffering });
          const result = (res && res.result) || res;
          if (result === 'PURCHASED' || result === 'RESTORED') { toast(tr('tip.thanks')); return; }
          if (result === 'CANCELLED') return;          // a choice, not a fault — say nothing
        } catch (e) {
          console.warn('paywall unavailable, falling back to the sheet:', e);
        }
      }
      showTipSheet();
    }

    function showTipSheet() {
      const box = $('tipOptions');
      box.innerHTML = '';
      for (const pkg of tipPackages) {
        const b = document.createElement('button');
        b.className = 'tip-opt';
        // priceString is already localised and currency-formatted by the store — never build this
        // from the raw number, or a British user is offered "$3".
        const price = (pkg.product && pkg.product.priceString) || '';
        const label = (pkg.product && pkg.product.title) || '';
        b.textContent = price ? `${label} · ${price}`.trim() : label;
        b.addEventListener('click', () => buyTip(pkg, b));
        box.appendChild(b);
      }
      const sheet = $('tipSheet');
      sheet.hidden = false;
      // A frame between un-hiding and opening, or there is no start state to transition from: an
      // element going display:none -> flex -> transformed in one task simply appears in place.
      void sheet.offsetHeight;
      sheet.classList.add('open');
    }

    let sheetClosing = null;
    function closeTipSheet() {
      const sheet = $('tipSheet');
      sheet.classList.remove('open');
      clearTimeout(sheetClosing);
      sheetClosing = setTimeout(() => { sheet.hidden = true; }, 320);
    }

    async function buyTip(pkg, button) {
      const rc = rcPlugin();
      if (!rc) return;
      // Guard the whole sheet, not just this button: a double tap on two different amounts would
      // otherwise start two purchases.
      $('tipOptions').querySelectorAll('.tip-opt').forEach(b => { b.disabled = true; });
      try {
        await rc.purchasePackage({ aPackage: pkg });
        closeTipSheet();
        toast(tr('tip.thanks'));
      } catch (e) {
        // A cancelled purchase is a choice, not a fault — say nothing and let them close the sheet.
        if (!(e && (e.code === 'PURCHASE_CANCELLED' || e.userCancelled))) toast(tr('tip.failed'));
        $('tipOptions').querySelectorAll('.tip-opt').forEach(b => { b.disabled = false; });
      }
    }

    $('startBtn').addEventListener('click', startCamera);
    $('shutter').addEventListener('click', scanScene);
    $('takePhotoBtn').addEventListener('click', takePhoto);
    $('rescanBtn').addEventListener('click', () => setCamState('idle'));
    $('shareBtn').addEventListener('click', sharePhoto);
    $('saveBtn').addEventListener('click', savePhoto);
    $('retakeBtn').addEventListener('click', retake);
    $('tipBtn').addEventListener('click', openTip);
    $('tipClose').addEventListener('click', closeTipSheet);
    $('tipSheet').addEventListener('click', (e) => {
      if (e && e.target && e.target.id === 'tipSheet') closeTipSheet();
    });
    initTipJar();
    $('scanAgain').addEventListener('click', async () => {
      if (!hasCamera) { stopLive(); show('home'); return; }
      show('camera');                       // before setCamState, so the bar can be measured
      if (await resumeCamera() === 'reacquired' && !hasCamera) { show('home'); return; }
      setCamState('idle');
      startLive();
    });
    $('gateScanAgain').addEventListener('click', closeGate);

    /* ── Level slider: horizon roll from the gravity vector (pitch-independent) ── */
    let motionGranted = false;

    const onMotion = (e) => {
      const a = e.accelerationIncludingGravity; if (!a) return;
      const x = a.x || 0, y = a.y || 0, z = a.z || 0;
      const g = Math.hypot(x, y, z) || 1;
      const wrap = $('camLevel'), line = $('camLevelLine'); if (!wrap || !line) return;

      // ROLL, and only roll: rotation about the axis the lens points down, which is the one thing
      // that tilts the horizon in the picture.
      const planar = Math.hypot(x, y);
      // Near flat, face up or down, almost no gravity is left in the screen plane and roll is two
      // noisy numbers handed to atan2 — it swings wildly and can read a confident 0.
      if (planar / g < 0.2) {
        wrap.classList.remove('level');
        line.style.opacity = '0';
        return;
      }
      line.style.opacity = '1';
      const roll = Math.atan2(-x, y) * 180 / Math.PI;   // + = phone rotated clockwise for the user
      const lean = ((roll + 90) % 180 + 180) % 180 - 90;
      liveLean = lean;
      // The horizon turns the opposite way to the phone, so the line lies at -lean.
      line.style.transform = 'rotate(' + (-lean).toFixed(1) + 'deg)';
      // The same 3-degree band the straighten cue clears at, so the line goes green exactly when
      // the cue goes away instead of a moment either side of it.
      wrap.classList.toggle('level', Math.abs(lean) < 3);
    };

    // Asked from the start tap, and BEFORE getUserMedia — that ordering is the whole fix. iOS
    // grants one permission prompt per user gesture, so when the camera prompt went first the
    // motion prompt was silently dropped and never appeared at all.
    async function requestMotion() {
      const DME = window.DeviceMotionEvent;
      if (!DME) return;
      try {
        if (typeof DME.requestPermission === 'function') {
          if (await DME.requestPermission() !== 'granted') return;   // denied: cues stay silent
        }
        window.addEventListener('devicemotion', onMotion);
        motionGranted = true;
      } catch (e) { /* unsupported or dismissed — degrade to no level cues */ }
    }
  </script>
</body>
</html>
