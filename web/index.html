<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>打卡吧！</title>
  <meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Warm Film palette ─── */
    :root {
      color-scheme: light dark;
      --bg: #F6F1E9;
      --surface: #ECE3D5;
      --text: #2B2620;
      --text2: #938979;
      --accent: #C57A52;
      --accent-tint: #F4E4D9;
      --tan: #C9A24B;
      --tan-tint: #FBF1E4;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    /* Dark counterpart — warm near-blacks, not neutral greys, so the "Warm Film" identity
       survives the flip. Only Home and Results theme: the camera screen and its overlays are
       deliberately hardcoded dark (a viewfinder must never go light behind a live preview).
       --accent is intentionally IDENTICAL in both themes: it is used as a button BACKGROUND
       under white text, so brightening it for dark mode would drop that pair to ~2.7:1.
       Left as-is it stays 3.3:1, and reads 5.6:1 as text on the dark bg. */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110D;
        --surface: #201B15;
        --text: #F2ECE1;
        --text2: #A0937E;
        --accent-tint: #2E2018;
        --tan-tint: #2A2117;
        --card-shadow: 0 2px 14px rgba(0,0,0,0.45);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      overflow: hidden;
    }

    .screen { display: none; position: fixed; inset: 0; }
    .screen.active { display: block; }

    /* ─── Home ─── */
    #home {
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 56px 32px calc(56px + env(safe-area-inset-bottom));
    }
    #home.active { display: flex; }

    .app-subtitle {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--text2);
    }

    .hero { flex: 1; display: flex; align-items: center; justify-content: center; }
    .viewfinder { position: relative; display: inline-flex; align-items: center; justify-content: center; padding: 28px; }
    .corner { position: absolute; width: 30px; height: 30px; }
    .corner-tl { top: -40px; left: -6px; border-top: 2px solid var(--text2); border-left: 2px solid var(--text2); }
    .corner-tr { top: -40px; right: -6px; border-top: 2px solid var(--text2); border-right: 2px solid var(--text2); }
    .corner-bl { bottom: -40px; left: -6px; border-bottom: 2px solid var(--text2); border-left: 2px solid var(--text2); }
    .corner-br { bottom: -40px; right: -6px; border-bottom: 2px solid var(--text2); border-right: 2px solid var(--text2); }

    .hud { position: absolute; font-size: 9px; letter-spacing: 1px; color: var(--text2); }
    .hud-rec { top: -32px; left: 4px; }
    .hud-time { top: -28px; left: 50%; transform: translateX(-50%); }
    .hud-bat { top: -34px; right: 4px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .hud-bat-bar { width: 22px; height: 7px; border: 1px solid var(--text2); border-radius: 1px; padding: 1px; }
    .hud-bat-fill { width: 70%; height: 100%; background: var(--text2); }
    .hud-format { bottom: -32px; right: 4px; }

    .title-block { display: flex; flex-direction: column; align-items: center; }
    .char { font-family: "Noto Serif SC", serif; font-size: 76px; font-weight: 700; color: var(--text); line-height: 1.12; }
    .char-row { display: flex; padding-left: 48px; }

    .home-bottom { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
    .start-btn {
      width: 100%; max-width: 360px; height: 54px;
      background: var(--accent); color: #fff; border: none;
      font-family: inherit; font-size: 17px; font-weight: 600; border-radius: 100px;
    }
    .start-btn:active { transform: scale(0.97); }
    .hint { font-size: 13px; color: var(--text2); }

    /* ─── Camera ─── */
    #camera { background: #1a1a1a; }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .grid-overlay { position: absolute; inset: 0; pointer-events: none; display: none; }
    .grid-line { position: absolute; background: rgba(255,255,255,0.3); }
    .grid-h1 { top: 33.33%; left: 0; width: 100%; height: 1px; }
    .grid-h2 { top: 66.66%; left: 0; width: 100%; height: 1px; }
    .grid-v1 { left: 33.33%; top: 0; height: 100%; width: 1px; }
    .grid-v2 { left: 66.66%; top: 0; height: 100%; width: 1px; }

    .scene-badge-top {
      position: absolute; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.45); color: #fff; padding: 6px 16px; border-radius: 100px;
      font-size: 14px; font-weight: 600; white-space: nowrap; display: none;
    }

    /* idle shutter */
    .cam-idle {
      position: absolute; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .shutter { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
    .shutter:active { transform: scale(0.92); }
    .shutter-inner { width: 56px; height: 56px; border-radius: 50%; background: #fff; }
    .shutter-hint { color: rgba(255,255,255,0.8); font-size: 13px; }

    /* level slider (device tilt) */
    #camLevel { position: absolute; top: calc(56px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 25; pointer-events: none; }
    #camLevelTrack { width: 200px; height: 2px; background: rgba(255,255,255,0.25); border-radius: 1px; position: relative; }
    #camLevelDot { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%); box-shadow: 0 0 6px rgba(0,0,0,.4); }
    #camLevelDot.on { background: #66bb6a; box-shadow: 0 0 10px rgba(102,187,106,.7); }
    #camLevelVal { font: 12px/1 monospace; color: rgba(255,255,255,.7); min-width: 34px; text-align: center; }
    #camLevelVal.on { color: #66bb6a; }

    /* live detection overlay + chips */
    #liveOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 23; }
    .coach-cue {
      position: absolute; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom));
      transform: translateX(-50%); display: none; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      padding: 8px 18px; border-radius: 100px; z-index: 27;
      pointer-events: none; white-space: nowrap;
    }
    .coach-cue.show { display: flex; }
    #coachText { font-size: 15px; color: #fff; font-weight: 600; }

    .status-chip { position: absolute; top: calc(56px + env(safe-area-inset-top)); left: 14px; z-index: 26; color: #fff; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 100px; display: none; background: rgba(0,0,0,0.5); }
    .status-chip.show { display: inline-block; }
    .status-chip.warn { background: rgba(200,90,60,0.9); }

    /* lens toggle (1× / 0.5×) */
    .lens-toggle { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom)); z-index: 26; display: none; gap: 2px; background: rgba(0,0,0,0.45); border-radius: 100px; padding: 3px; }
    .lens-toggle.show { display: flex; }
    .lens-opt { color: rgba(255,255,255,0.7); font-size: 13px; padding: 5px 14px; border-radius: 100px; }
    .lens-opt.active { background: rgba(255,255,255,0.92); color: #1a1a1a; }

    /* capture gate */
    .gate-block { position: absolute; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: rgba(20,18,16,0.92); padding: 40px; text-align: center; }
    .gate-block.show { display: flex; }
    .gate-msg { color: #fff; font-size: 18px; line-height: 1.5; max-width: 320px; }

    /* loading */
    .loading { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,0.55); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
    .loading.active { display: flex; }
    .spinner { width: 52px; height: 52px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #fff; font-size: 15px; }

    /* tip panel (overlays live camera) */
    .tip-panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: rgba(20,20,18,0.78); border-radius: 16px 16px 0 0;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      display: none; animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .take-photo { width: 100%; height: 46px; background: var(--accent); color: #fff; border: none; font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 100px; margin-bottom: 6px; }
    .take-photo:active { transform: scale(0.97); }
    .rescan { display: block; text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; padding: 4px; }

    /* ─── Results ─── */
    #results { background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .results-inner { min-height: 100%; display: flex; flex-direction: column; }
    .photo-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; flex-shrink: 0; }
    #resultPhoto { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scene-badge { position: absolute; bottom: 14px; left: 14px; background: rgba(0,0,0,0.45); color: #fff; padding: 6px 16px; border-radius: 100px; font-size: 14px; font-weight: 600; }
    .filter-btn { position: absolute; bottom: 14px; right: 14px; background: rgba(0,0,0,0.45); color: #fff; padding: 6px 16px; border-radius: 100px; font-size: 12px; font-weight: 500; border: none; font-family: inherit; }
    .filter-btn.active { background: rgba(197,122,82,0.92); }

    .cards { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: var(--card-shadow); }
    .card-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
    .card-title .ch { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 10px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .pill { background: var(--accent-tint); color: var(--accent); padding: 5px 14px; border-radius: 100px; font-size: 13px; font-weight: 500; }
    .pill:active { transform: scale(0.95); }
    .copy-all { font-size: 13px; color: var(--accent); font-weight: 500; }

    .bottom { padding: 8px 16px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .btn { width: 100%; height: 52px; border: none; border-radius: 100px; font-family: inherit; font-size: 16px; font-weight: 600; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg); color: var(--accent); border: 1.5px solid var(--accent); }
    .scan-again { font-size: 14px; color: var(--text2); padding: 6px; }

    /* toast */
    .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 80%; text-align: center; }
    .toast.show { opacity: 1; }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <!-- ── Home ── -->
  <section id="home" class="screen active">
    <div class="app-subtitle">Find your perfect shot</div>
    <div class="hero">
      <div class="viewfinder">
        <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div><div class="corner corner-br"></div>
        <span class="hud hud-rec">● REC</span>
        <span class="hud hud-time">00:00:00</span>
        <div class="hud hud-bat"><span>BAT</span><span class="hud-bat-bar"><span class="hud-bat-fill"></span></span></div>
        <span class="hud hud-format">4K 30fps</span>
        <div class="title-block">
          <span class="char">打</span>
          <span class="char">卡</span>
          <div class="char-row"><span class="char">吧</span><span class="char">！</span></div>
        </div>
      </div>
    </div>
    <div class="home-bottom">
      <button class="start-btn" id="startBtn">开始打卡</button>
      <div class="hint">Point at an empty scene to begin</div>
    </div>
  </section>

  <!-- ── Camera ── -->
  <section id="camera" class="screen">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="liveOverlay"></canvas>
    <div id="coachCue" class="coach-cue">
      <span id="coachText">Align the dots</span>
    </div>

    <div class="status-chip" id="statusChip"></div>

    <div class="grid-overlay" id="gridOverlay">
      <div class="grid-line grid-h1"></div><div class="grid-line grid-h2"></div>
      <div class="grid-line grid-v1"></div><div class="grid-line grid-v2"></div>
    </div>

    <div class="scene-badge-top" id="sceneBadgeTop"></div>

    <!-- level slider (device tilt) -->
    <div id="camLevel">
      <div id="camLevelTrack"><div id="camLevelDot"></div></div>
      <span id="camLevelVal">0°</span>
    </div>

    <!-- idle: shutter -->
    <div class="cam-idle" id="camIdle">
      <div class="shutter" id="shutter"><div class="shutter-inner"></div></div>
      <div class="shutter-hint">Point at an empty scene and tap</div>
    </div>

    <!-- lens toggle (shown only if an ultra-wide camera exists) -->
    <div class="lens-toggle" id="lensToggle">
      <span class="lens-opt active" data-lens="wide">1×</span>
      <span class="lens-opt" data-lens="ultra">0.5×</span>
    </div>

    <!-- tips panel -->
    <div class="tip-panel" id="tipPanel">
      <button class="take-photo" id="takePhotoBtn">Take Photo</button>
      <span class="rescan" id="rescanBtn">Scan again</span>
    </div>

    <!-- loading -->
    <div class="loading" id="camLoading">
      <div class="spinner"></div>
      <div class="loading-text">Analysing scene…</div>
    </div>

    <!-- capture gate (poor light / blurry) -->
    <div class="gate-block" id="gateBlock">
      <div class="gate-msg" id="gateMsg"></div>
      <button class="start-btn" id="gateScanAgain" style="max-width:260px;">Scan again</button>
    </div>
  </section>

  <!-- ── Results ── -->
  <section id="results" class="screen">
    <div class="results-inner">
      <div class="photo-wrap">
        <img id="resultPhoto" alt="" />
        <div class="scene-badge" id="sceneBadge"></div>
        <button class="filter-btn" id="filterBtn">Tap to preview filter</button>
      </div>
      <div class="cards" id="cards"></div>
      <div class="bottom">
        <button class="btn btn-primary" id="shareBtn">Share</button>
        <button class="btn btn-secondary" id="saveBtn">Save</button>
        <div class="scan-again" id="scanAgain">Scan again</div>
      </div>
    </div>
  </section>

  <input type="file" id="fileInput" accept="image/*" capture="environment" />
  <div class="toast" id="toast"></div>

  <script>
    const API = 'https://daka-backend-9bfz.onrender.com';

    const FILTER_CSS = {
      'Vivid':         'saturate(1.5) contrast(1.12)',
      'Vivid Warm':    'saturate(1.45) contrast(1.1) sepia(0.22)',
      'Vivid Cool':    'saturate(1.4) contrast(1.1) brightness(1.03) hue-rotate(6deg)',
      'Dramatic':      'contrast(1.3) saturate(0.9) brightness(0.95)',
      'Dramatic Warm': 'contrast(1.3) saturate(0.95) brightness(0.95) sepia(0.25)',
      'Dramatic Cool': 'contrast(1.32) saturate(0.85) brightness(0.95) hue-rotate(8deg)',
      'Silvertone':    'grayscale(1) sepia(0.25) contrast(1.05) brightness(1.05)',
      'Noir':          'grayscale(1) contrast(1.45) brightness(0.92)',
    };

    /* ── State ── */
    let stream = null;
    let analysisResult = null;  // result from the scene scan
    let capturedImg = null;     // the keeper photo (full-res Image)
    let currentFilter = 'Vivid';
    let filterActive = false;
    let hasCamera = false;
    let ultraDeviceId = null, currentLens = 'wide', ultraAvailable = false;

    const $ = (id) => document.getElementById(id);
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
    }
    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function scaledSize(w, h, cap) { const m = Math.max(w, h); if (m <= cap) return [w, h]; const r = cap / m; return [Math.round(w*r), Math.round(h*r)]; }
    function errMsg(e) { return e.name === 'AbortError' ? 'Server took too long — it may be waking up. Try again.' : (e.message || 'Analysis failed'); }

    /* ── Coaching state ──
       standPos is where the SUBJECT should stand IN FRAME, from analysis.placement, whose x the
       engine has already snapped to a rule-of-thirds line. It is a composition target, not a point
       to aim the camera at: panning until it reaches screen-centre would drag the subject to dead
       centre and throw away the placement the engine solved for. So it is drawn at a fixed spot in
       frame and deliberately does not move with the phone.

       A two-dot "framing lock" used to live here, tracking drift from the scanned framing via
       deviceorientation.alpha. Removed, because it could not work: a phone held upright with the
       rear camera on the horizon sits at beta ~= 90 degrees, the gimbal-lock singularity of the
       W3C Z-X-Y angle sequence, where alpha and gamma become degenerate. alpha then swings wildly
       while the phone is nearly still, so the dots jumped and never settled. Not a tuning problem
       and not a sign error — the sensor cannot separate yaw from roll in exactly the pose this app
       is used in. Restoring a drift warning needs a different signal: integrating
       devicemotion.rotationRate over the short scan-to-shoot window. Gravity alone cannot measure
       yaw at all. The level slider is unaffected — it reads gravity, not orientation. */
    let coachingActive = false;
    let standPos = null;           // {x, y} from analysis.placement — where the subject stands

    /* ── Camera state (idle | loading | tips) ── */
    function setCamState(s) {
      $('camIdle').style.display     = s === 'idle' ? 'flex' : 'none';
      $('camLoading').classList.toggle('active', s === 'loading');
      const tips = s === 'tips';
      $('gridOverlay').style.display = tips ? 'block' : 'none';
      $('sceneBadgeTop').style.display = tips ? 'block' : 'none';
      $('tipPanel').style.display    = tips ? 'block' : 'none';
      $('camLevel').style.display    = tips ? 'flex' : 'none';   // no level/tilt on the initial scan
      updateLensVisibility();
      if (s !== 'tips') resetCoaching();
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
        $('video').srcObject = stream;
        hasCamera = true;
        setCamState('idle');
        show('camera');
        detectLenses();
        startLive();
      } catch (e) {
        hasCamera = false;
        toast('Camera unavailable — pick a photo instead');
        $('fileInput').click();
      }
    }

    /* ── 1×/0.5× ultra-wide lens (feature-detected) ── */
    function updateLensVisibility() { $('lensToggle').classList.toggle('show', ultraAvailable && $('camIdle').style.display === 'flex'); }
    async function detectLenses() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter(d => d.kind === 'videoinput');
        const ultra = vids.find(d => /ultra|0\.5/i.test(d.label) && /back|rear|environment/i.test(d.label))
                   || vids.find(d => /ultra/i.test(d.label));
        if (ultra) { ultraDeviceId = ultra.deviceId; ultraAvailable = true; }
      } catch (e) { /* labels need camera permission — leave the toggle hidden */ }
      updateLensVisibility();
    }
    async function switchLens(lens) {
      if (lens === currentLens) return;
      const constraints = (lens === 'ultra' && ultraDeviceId)
        ? { video: { deviceId: { exact: ultraDeviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }
        : { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
      try {
        const ns = await navigator.mediaDevices.getUserMedia(constraints);
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = ns; $('video').srcObject = ns; currentLens = lens;
        document.querySelectorAll('.lens-opt').forEach(o => o.classList.toggle('active', o.dataset.lens === lens));
        if (lens === 'ultra') toast('0.5× wide — keep your subject centred to avoid edge distortion');
      } catch (e) { toast('Could not switch lens'); }
    }
    document.querySelectorAll('.lens-opt').forEach(o => o.addEventListener('click', () => switchLens(o.dataset.lens)));

    /* ── Live scene guards (blur / blocked) ── */
    let liveActive = false, liveRAF = null, lastCheck = 0;
    const _fs = document.createElement('canvas'); _fs.width = 64; _fs.height = 64;

    /* ── Coaching helpers ── */
    function setCue(text) {
      const el = $('coachCue');
      if (!text) { el.classList.remove('show'); return; }
      $('coachText').textContent = text;
      el.classList.add('show');
    }

    // Standing marker: a footprint at the engine's placement point with a dotted body box above
    // it, drawn at a FIXED spot in frame. This is the composition — it does not move with the
    // phone, because the subject is meant to stand on the thirds line of the shot you scanned.
    function drawStandMarker(tf, ctx, x, y, green) {
      const fx = tf.PX(x), fy = tf.PY(y);
      const rw = tf.SY(0.09), rh = tf.SY(0.028), hw = rw * 0.9, boxH = tf.SY(0.6);
      ctx.save();
      ctx.strokeStyle = green ? 'rgba(102,187,106,0.9)' : 'rgba(197,122,82,0.9)';
      ctx.fillStyle = green ? 'rgba(102,187,106,0.22)' : 'rgba(197,122,82,0.18)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(fx, fy, rw, rh, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.setLineDash([7, 7]); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(fx - hw, fy); ctx.lineTo(fx - hw, fy - boxH);
      ctx.moveTo(fx + hw, fy); ctx.lineTo(fx + hw, fy - boxH);
      ctx.moveTo(fx - hw, fy - boxH); ctx.lineTo(fx + hw, fy - boxH);
      ctx.stroke();
      ctx.restore();
    }

    function coverTF(video, canvas) {
      const W = canvas.clientWidth, H = canvas.clientHeight; canvas.width = W; canvas.height = H;
      const vw = video.videoWidth || W, vh = video.videoHeight || H;
      const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
      return { W, H, vw, vh, PX: n => ox + n * dw, PY: n => oy + n * dh, SX: n => n * dw, SY: n => n * dh };
    }

    function frameStats(video) {
      const ctx = _fs.getContext('2d'); ctx.drawImage(video, 0, 0, 64, 64);
      const d = ctx.getImageData(0, 0, 64, 64).data;
      const lum = new Float32Array(64 * 64); let sum = 0;
      for (let i = 0, j = 0; i < d.length; i += 4, j++) { const L = 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2]; lum[j] = L; sum += L; }
      const brightness = sum / (64 * 64);
      let grad = 0, n = 0;                                 // horizontal high-frequency energy → sharpness proxy
      for (let y = 0; y < 64; y++) for (let x = 1; x < 64; x++) { grad += Math.abs(lum[y*64+x] - lum[y*64+x-1]); n++; }
      const detail = grad / n;
      return { brightness, detail };
    }

    function startLive() { if (liveActive) return; liveActive = true; liveLoop(); }
    function resetCoaching() {
      coachingActive = false; standPos = null;
      setCue(null);
    }
    function stopLive() {
      liveActive = false; if (liveRAF) cancelAnimationFrame(liveRAF); liveRAF = null;
      const cv = $('liveOverlay'); if (cv.width) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
      $('statusChip').classList.remove('show');
      resetCoaching();
    }
    function liveLoop() {
      if (!liveActive) return;
      liveRAF = requestAnimationFrame(liveLoop);
      const video = $('video'); if (!video.videoWidth) return;
      const cv = $('liveOverlay'), tf = coverTF(video, cv), ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, tf.W, tf.H);

      // scene guards (~3×/sec)
      const now = performance.now();
      if (now - lastCheck > 300) {
        lastCheck = now;
        const st = frameStats(video);
        let msg = '';
        if (st.brightness < 22 || st.detail < 1.3) msg = 'Camera blocked';
        else if (st.detail < 3.2) msg = 'Hold steady — blurry';
        const s = $('statusChip');
        if (msg) { s.textContent = msg; s.classList.add('show', 'warn'); }
        else s.classList.remove('show');
      }

      // ── coaching overlay: the standing marker, fixed in frame ──
      if (coachingActive && standPos) {
        drawStandMarker(tf, ctx, standPos.x, standPos.y, true);
        setCue('Have them stand on the marker');
      }
    }

    function openGate(msg) { $('camLoading').classList.remove('active'); $('gateMsg').textContent = msg; $('gateBlock').classList.add('show'); }
    function closeGate() { $('gateBlock').classList.remove('show'); setCamState('idle'); }

    /* ── Frame grabbing ── */
    function grabScanBlob() {
      const v = $('video'); if (!v.videoWidth) return null;
      const [w, h] = scaledSize(v.videoWidth, v.videoHeight, 1024);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(v, 0, 0, w, h);
      return new Promise(r => cv.toBlob(b => r(b), 'image/jpeg', 0.7));
    }
    async function grabKeeperDataURL() {
      const v = $('video'); if (!v.videoWidth) return null;
      // full-sensor still via ImageCapture where supported (Android Chrome); else the full video frame
      try {
        const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
        if (track && window.ImageCapture) {
          const blob = await new ImageCapture(track).takePhoto();
          return await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
        }
      } catch (e) { /* fall through to canvas capture */ }
      const [w, h] = scaledSize(v.videoWidth, v.videoHeight, 2560);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(v, 0, 0, w, h);
      return cv.toDataURL('image/jpeg', 0.95);
    }
    function loadCaptured(dataURL) { capturedImg = new Image(); capturedImg.src = dataURL; $('resultPhoto').src = dataURL; }

    /* ── Backend ── */
    async function postAnalyze(blob) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      try {
        const fd = new FormData(); fd.append('file', blob, 'photo.jpg');
        const res = await fetch(API + '/analyze', { method: 'POST', body: fd, signal: controller.signal });
        let data; try { data = await res.json(); } catch (e) { throw new Error('Bad response from server'); }
        if (!res.ok) throw new Error(data.error || data.message || data.detail || ('Server error (' + res.status + ')'));
        if (data.error || !data.lighting) throw new Error(data.error || 'Bad response from server');
        return data;
      } finally { clearTimeout(timer); }
    }

    /* ── Stage 1: scan the scene ── */
    async function scanScene() {
      const blob = await grabScanBlob();
      if (!blob) { toast('Camera not ready yet'); return; }
      setCamState('loading');
      try {
        analysisResult = await postAnalyze(blob);
        // capture gate: block on poor light or a blurry frame — force a rescan
        if (analysisResult.lighting && analysisResult.lighting.quality === 'Poor') { openGate('Not enough light — find a brighter spot, then scan again.'); return; }
        if (analysisResult.blurry) { openGate('That shot was blurry — hold steady, then scan again.'); return; }
        renderTips(analysisResult);
        // Where the subject should stand; fall back to a plain rule-of-thirds point.
        // != null, not truthiness: a legitimate 0 coordinate must not fall through to the default.
        const p = analysisResult.placement;
        standPos = (p && p.x != null && p.y != null) ? { x: p.x, y: p.y } : { x: 1/3, y: 2/3 };
        coachingActive = true;
        $('coachCue').classList.add('show');
        setCue('Have them stand on the marker');
        setCamState('tips');
      } catch (e) {
        setCamState('idle');
        toast(errMsg(e));
      }
    }

    function renderTips(r) {
      $('sceneBadgeTop').textContent = r.scene_type || 'Scene';
    }

    /* ── Stage 2: take the keeper photo → results ── */
    async function takePhoto() {
      const dataURL = await grabKeeperDataURL();
      if (!dataURL) { toast('Camera not ready'); return; }
      loadCaptured(dataURL);
      stopLive();
      renderResults(analysisResult);
      show('results');
    }

    function renderResults(r) {
      currentFilter = FILTER_CSS[r.filter] ? r.filter : 'Vivid';
      filterActive = false;
      updateFilterUI();
      $('sceneBadge').textContent = r.scene_type || 'Scene';
      const pills = (r.hashtags || []).map(h => '<div class="pill" data-tag="' + esc(h) + '">' + esc(h) + '</div>').join('');
      $('cards').innerHTML = pills
        ? '<div class="card"><div class="card-title">Hashtags <span class="ch">tap to copy</span></div><div class="pills">' + pills + '</div><div class="copy-all" id="copyAll">Copy all</div></div>'
        : '';
      $('cards').querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => copyText(p.dataset.tag, 'Copied!')));
      const ca = $('copyAll');
      if (ca) ca.addEventListener('click', () => copyText((r.hashtags || []).join(' '), 'All copied!'));
    }

    /* ── Filter toggle ── */
    function updateFilterUI() {
      $('resultPhoto').style.filter = filterActive ? FILTER_CSS[currentFilter] : '';
      const btn = $('filterBtn');
      btn.textContent = filterActive ? currentFilter : 'Tap to preview filter';
      btn.classList.toggle('active', filterActive);
      $('saveBtn').textContent = filterActive ? 'Save with filter' : 'Save';
    }

    /* ── Pixel-baked filters (match preview exactly) ── */
    function applyFilters(d, css) {
      const re = /([\w-]+)\(([^)]+)\)/g; let m;
      while ((m = re.exec(css))) {
        const v = parseFloat(m[2]);
        if (m[1] === 'brightness') brightness(d, v);
        else if (m[1] === 'saturate') saturate(d, v);
        else if (m[1] === 'contrast') contrast(d, v);
        else if (m[1] === 'sepia') sepia(d, v);
        else if (m[1] === 'hue-rotate') hueRotate(d, v);
        else if (m[1] === 'grayscale') grayscale(d, v);
      }
    }
    function brightness(d, v) { for (let i = 0; i < d.length; i += 4) { d[i]*=v; d[i+1]*=v; d[i+2]*=v; } }
    function contrast(d, v) { for (let i = 0; i < d.length; i += 4) { d[i]=(d[i]-128)*v+128; d[i+1]=(d[i+1]-128)*v+128; d[i+2]=(d[i+2]-128)*v+128; } }
    function saturate(d, v) { for (let i = 0; i < d.length; i += 4) { const l=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; d[i]=l+(d[i]-l)*v; d[i+1]=l+(d[i+1]-l)*v; d[i+2]=l+(d[i+2]-l)*v; } }
    function sepia(d, a) { const n=1-a; for (let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2]; d[i]=n*r+a*(0.393*r+0.769*g+0.189*b); d[i+1]=n*g+a*(0.349*r+0.686*g+0.168*b); d[i+2]=n*b+a*(0.272*r+0.534*g+0.131*b); } }
    function grayscale(d, a) { const n=1-a; for (let i=0;i<d.length;i+=4){ const gr=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; d[i]=n*d[i]+a*gr; d[i+1]=n*d[i+1]+a*gr; d[i+2]=n*d[i+2]+a*gr; } }
    function hueRotate(d, deg) {
      const r=deg*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
      const m0=0.213+c*0.787-s*0.213, m1=0.715-c*0.715-s*0.715, m2=0.072-c*0.072+s*0.928;
      const m3=0.213-c*0.213+s*0.143, m4=0.715+c*0.285+s*0.140, m5=0.072-c*0.072-s*0.283;
      const m6=0.213-c*0.213-s*0.787, m7=0.715-c*0.715+s*0.715, m8=0.072+c*0.928+s*0.072;
      for (let i=0;i<d.length;i+=4){ const R=d[i],G=d[i+1],B=d[i+2]; d[i]=R*m0+G*m1+B*m2; d[i+1]=R*m3+G*m4+B*m5; d[i+2]=R*m6+G*m7+B*m8; }
    }

    /* ── Watermark baked into saved/shared images ── */
    function drawWatermark(ctx, w, h) {
      const fs = Math.max(13, Math.round(w * 0.028));
      ctx.save();
      ctx.font = '600 ' + fs + 'px Georgia, "Noto Serif SC", serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = fs * 0.35; ctx.shadowOffsetY = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const pad = Math.round(w * 0.03);
      ctx.fillText('Shot with 打卡AI', w - pad, h - pad);
      ctx.restore();
    }

    /* ── Save / share ── */
    function bakeBlob() {
      return new Promise(resolve => {
        const cv = document.createElement('canvas');
        cv.width = capturedImg.naturalWidth; cv.height = capturedImg.naturalHeight;
        const ctx = cv.getContext('2d');
        ctx.drawImage(capturedImg, 0, 0);
        if (filterActive && FILTER_CSS[currentFilter]) {
          const id = ctx.getImageData(0, 0, cv.width, cv.height);
          applyFilters(id.data, FILTER_CSS[currentFilter]);
          ctx.putImageData(id, 0, 0);
        }
        drawWatermark(ctx, cv.width, cv.height);
        cv.toBlob(b => resolve(b), 'image/jpeg', 0.95);
      });
    }
    async function shareOrSave(useShare) {
      if (!capturedImg) return;
      const blob = await bakeBlob();
      const tags = (analysisResult && analysisResult.hashtags || []).join(' ');
      const file = new File([blob], 'daka.jpg', { type: 'image/jpeg' });
      if (useShare && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], text: tags }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      if (!useShare && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'daka.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('Saved');
    }
    async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch (e) { toast('Copy failed'); } }

    /* ── File fallback (no live camera): analyse → results directly ── */
    $('fileInput').addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => loadCaptured(reader.result);
      reader.readAsDataURL(f);
      $('camLoading').classList.add('active'); show('camera');
      try {
        analysisResult = await postAnalyze(f);
        renderResults(analysisResult);
        show('results');
      } catch (err) { toast(errMsg(err)); show('home'); }
      finally { $('camLoading').classList.remove('active'); }
    });

    /* ── Wire up ── */
    $('startBtn').addEventListener('click', startCamera);
    $('shutter').addEventListener('click', scanScene);
    $('takePhotoBtn').addEventListener('click', takePhoto);
    $('rescanBtn').addEventListener('click', () => setCamState('idle'));
    $('filterBtn').addEventListener('click', () => { filterActive = !filterActive; updateFilterUI(); });
    $('shareBtn').addEventListener('click', () => shareOrSave(true));
    $('saveBtn').addEventListener('click', () => shareOrSave(false));
    $('scanAgain').addEventListener('click', () => { if (hasCamera) { setCamState('idle'); show('camera'); startLive(); } else { stopLive(); show('home'); } });
    $('gateScanAgain').addEventListener('click', closeGate);

    /* ── Level slider: horizon roll from the gravity vector (pitch-independent) ── */
    (function setupLevel() {
      const onMotion = (e) => {
        const a = e.accelerationIncludingGravity; if (!a) return;
        const x = a.x || 0, y = a.y || 0, z = a.z || 0;
        const g = Math.hypot(x, y, z) || 1;
        const d = $('camLevelDot'), v = $('camLevelVal'); if (!d || !v) return;
        // Angle of the phone's long axis from world-vertical: 0 = perfectly upright, 90 = flat.
        // Pitching (aim up/down) OR rolling (lean left/right) raises it; yawing (rotating while
        // staying upright) leaves it at 0. |y| makes it sign-agnostic across iOS/Android.
        const tilt = Math.acos(Math.min(1, Math.abs(y) / g)) * 180 / Math.PI;
        // roll (horizon lean) is what positions the dot; tilt is what's read out as degrees
        const lean = Math.atan2(x, Math.abs(y)) * 180 / Math.PI;
        const p = Math.max(0, Math.min(100, ((lean / 30) + 1) * 50));
        const upright = tilt < 3;                                        // green anywhere in 0–3°
        d.style.left = p + '%';
        d.classList.toggle('on', upright);
        v.classList.toggle('on', upright);
        v.textContent = Math.round(tilt) + '°';
      };
      const begin = () => window.addEventListener('devicemotion', onMotion);
      const DME = window.DeviceMotionEvent;
      if (DME && typeof DME.requestPermission === 'function') {
        // iOS 13+: motion permission must be requested from a user gesture
        $('startBtn').addEventListener('click', () => {
          DME.requestPermission().then(r => { if (r === 'granted') begin(); }).catch(() => {});
        });
      } else if (DME) {
        begin();
      }
    })();
  </script>
</body>
</html>
