<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>打卡吧！</title>
  <meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Warm Film palette ─── */
    :root {
      color-scheme: light dark;
      --bg: #F6F1E9;
      --surface: #ECE3D5;
      --text: #2B2620;
      --text2: #938979;
      --accent: #C57A52;
      --accent-tint: #F4E4D9;
      --tan: #C9A24B;
      --tan-tint: #FBF1E4;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.05);

      /* ── Home screen proportions ──
         Raise a gap to spread the framing out, lower it to close in on the mark. --mark-inset
         moves the edge the marks and labels are both measured from, so it moves both.
         space under the hint line at the bottom of the screen Raise a gap to spread the framing
         out, lower it to close in on the mark. --mark-inset moves the edge everything else is
         measured from, so it moves the marks AND the labels. */
      --mark-size: clamp(76px, 24vw, 96px);
      --mark-inset: 34px;
      --mark-gap: 46px;
      --hud-gap: 38px;
      --home-bottom: 24px;
    }

    /* Dark counterpart — warm near-blacks, not neutral greys, so the "Warm Film" identity
       survives the flip. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14110D;
        --surface: #201B15;
        --text: #F2ECE1;
        --text2: #A0937E;
        --accent-tint: #2E2018;
        --tan-tint: #2A2117;
        --card-shadow: 0 2px 14px rgba(0,0,0,0.45);
      }
    }
    :root[data-theme="dark"] {
      --bg: #14110D;
      --surface: #201B15;
      --text: #F2ECE1;
      --text2: #A0937E;
      --accent-tint: #2E2018;
      --tan-tint: #2A2117;
      --card-shadow: 0 2px 14px rgba(0,0,0,0.45);
    }
    /* color-scheme has to follow the choice too, or the browser keeps painting form controls,
       scrollbars and the overscroll gutter in the OS theme behind a page in the opposite one. */
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    /* The `hidden` attribute is only display:none in the USER-AGENT stylesheet, so any author
       rule that sets display beats it — .sheet's own `display: flex` did exactly that, and the
       tip sheet covered the whole screen from launch with nothing tappable behind it. */
    [hidden] { display: none !important; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      overflow: hidden;
    }

    .screen { display: none; position: fixed; inset: 0; }
    .screen.active { display: block; }

    /* ─── Home ─── */
    #home {
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 46px 32px calc(var(--home-bottom) + env(safe-area-inset-bottom));
    }
    #home.active { display: flex; }

    .hero { flex: 1; display: flex; align-items: center; justify-content: center; }
    .viewfinder { position: relative; display: inline-flex; align-items: center; justify-content: center; padding: var(--mark-inset); }
    .corner { position: absolute; width: 38px; height: 38px; }
    .corner-tl { top: calc(var(--mark-gap) * -1); left: -8px; border-top: 3px solid var(--text2); border-left: 3px solid var(--text2); }
    .corner-tr { top: calc(var(--mark-gap) * -1); right: -8px; border-top: 3px solid var(--text2); border-right: 3px solid var(--text2); }
    .corner-bl { bottom: calc(var(--mark-gap) * -1); left: -8px; border-bottom: 3px solid var(--text2); border-left: 3px solid var(--text2); }
    .corner-br { bottom: calc(var(--mark-gap) * -1); right: -8px; border-bottom: 3px solid var(--text2); border-right: 3px solid var(--text2); }

    .hud { position: absolute; font-size: 11px; letter-spacing: 1px; color: var(--text2); }
    .hud-rec { top: calc(var(--hud-gap) * -1); left: 2px; }
    .hud-time { top: calc((var(--hud-gap) - 4px) * -1); left: 50%; transform: translateX(-50%); }
    .hud-bat { top: calc((var(--hud-gap) + 3px) * -1); right: 2px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    /* The outline is drawn with a shadow rather than a border, so it can be 1px in light and 1.5
       in dark without changing the icon's size. */
    .hud-bat-bar {
      width: 26px; height: 10px; border-radius: 2px; padding: 2px;
      box-shadow: inset 0 0 0 1px var(--text2);
    }
    .hud-bat-fill { width: 80%; height: 100%; background: var(--text2); border-radius: 1px; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .hud-bat-bar { box-shadow: inset 0 0 0 1.5px var(--text2); }
    }
    :root[data-theme="dark"] .hud-bat-bar { box-shadow: inset 0 0 0 1.5px var(--text2); }
    .hud-format { bottom: calc(var(--hud-gap) * -1); right: 2px; }

    .title-block { display: flex; flex-direction: column; align-items: center; }
    .char { font-family: "Noto Serif SC", serif; font-size: var(--mark-size); font-weight: 700; color: var(--text); line-height: 1.12; }
    .char-row { display: flex; padding-left: 48px; }

    /* Language is chosen on the way in, so the switch lives on the home screen only. */
    .theme-toggle {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 16px;
      display: flex; padding: 2px; gap: 2px;
      border: 1px solid var(--text2); border-radius: 100px;
    }
    .theme-opt {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 24px; padding: 0;
      border: none; background: none; color: var(--text2); border-radius: 100px;
    }
    .theme-opt svg { width: 14px; height: 14px; display: block; }
    .theme-opt.on { background: var(--accent); color: #fff; }

    .lang-toggle {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px;
      display: flex; padding: 2px; gap: 2px;
      border: 1px solid var(--text2); border-radius: 100px;
    }
    .lang-opt {
      font-family: inherit; font-size: 11px; line-height: 1; padding: 6px 11px;
      border: none; background: none; color: var(--text2); border-radius: 100px;
    }
    .lang-opt.on { background: var(--accent); color: #fff; }

    .home-bottom { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
    .start-btn {
      width: 100%; max-width: 290px; height: 48px;
      background: var(--accent); color: #fff; border: none;
      font-family: inherit; font-size: 16px; font-weight: 600; border-radius: 100px;
    }
    .start-btn:active { transform: scale(0.97); }
    .hint { font-size: 13px; color: var(--text2); }

    /* ─── Camera ─── */
    /* The viewfinder gets its own region and the controls sit BELOW it, rather than floating on
       top of a full-screen video. */
    #camera { background: #14120F; }
    #camera.active { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }

    /* The same live feed, blurred and dimmed, filling everything the 3:4 frame does not. */
    #videoBackdrop {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      filter: blur(34px) brightness(0.45) saturate(0.85);
      transform: scale(1.15);        /* push the blur's own soft edge off screen */
      z-index: 0; pointer-events: none;
    }
    /* A fixed 3:4 frame — the shape a phone camera natively produces, and the shape every camera
       app shows. */
    .cam-frame {
      position: relative; overflow: hidden; background: #000; z-index: 1;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.28), 0 18px 50px rgba(0,0,0,0.45);
      flex: 0 0 auto; margin: 0 auto;
      width: min(100%, calc(72vh * 0.75));
      width: min(100%, calc(72dvh * 0.75));
      aspect-ratio: 3 / 4;

      /* The frame travels: top-middle to compose, centre of the screen while the scan is in
         flight, top-middle again to coach. */
      transition: transform 340ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-reduced-motion: reduce) { .cam-frame { transition: none; } }
    .cam-controls {
      flex: 0 1 auto; position: relative; z-index: 2;

      /* No background and no blur of its own. */
      background: transparent;
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;

      /* The three states put different things in here — a shutter, nothing at all, then the tip
         panel — so the bar changes height and the frame centred above it jumps with it. */
      overflow: hidden;
      transition: height 340ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-reduced-motion: reduce) { .cam-controls { transition: none; } }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .grid-overlay { position: absolute; inset: 0; pointer-events: none; display: none; }
    .grid-line { position: absolute; background: rgba(255,255,255,0.3); }
    .grid-h1 { top: 33.33%; left: 0; width: 100%; height: 1px; }
    .grid-h2 { top: 66.66%; left: 0; width: 100%; height: 1px; }
    .grid-v1 { left: 33.33%; top: 0; height: 100%; width: 1px; }
    .grid-v2 { left: 66.66%; top: 0; height: 100%; width: 1px; }

    .scene-badge-top {
      position: absolute; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.45); color: #fff; padding: 6px 16px; border-radius: 100px;
      font-size: 14px; font-weight: 600; white-space: nowrap; display: none;
      /* Centred, with the level bar in the right corner — so it is capped short of reaching it. */
      max-width: calc(100% - 200px); overflow: hidden; text-overflow: ellipsis;
    }

    /* idle shutter */
    .cam-idle { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .shutter { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 4px solid #fff; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 1px 5px rgba(0,0,0,0.55)); }
    .shutter:active { transform: scale(0.92); }
    .shutter-inner { width: 56px; height: 56px; border-radius: 50%; background: #fff; }
    .shutter-hint { color: rgba(255,255,255,0.92); font-size: 13px; }

    /* Horizon level, the way a camera app does it: a line lying at the angle the phone is
       actually rotated to, over a fixed horizontal reference, the two merging when you are
       level. */
    #camLevel { position: absolute; inset: 0; display: none; z-index: 25; pointer-events: none; }
    #camLevelRef, #camLevelLine {
      position: absolute; left: 31%; width: 38%; top: calc(50% - 1px); height: 2px;
      border-radius: 2px; transform-origin: 50% 50%;
    }
    #camLevelRef  { background: rgba(255,255,255,0.3); }
    #camLevelLine { background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(0,0,0,0.55); }
    /* Level: the two lines coincide, so the reference drops away and the line carries the colour. */
    #camLevel.level #camLevelRef  { opacity: 0; }
    #camLevel.level #camLevelLine { background: #66bb6a; box-shadow: 0 0 10px rgba(102,187,106,.75); }
    /* while a straighten cue is showing, the line is the thing to look at */
    #camLevel.needs-fix #camLevelLine { background: #E67E22; box-shadow: 0 0 10px rgba(230,126,34,.8); }

    /* Crop marks on the frame corners: the clearest way to say the sharp rectangle is the shot
       and the blur around it is not. */
    /* Square, not round: a rectangle reads as a focus area, a circle reads as a tap ripple. */
    #focusRing {
      position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px;
      border: 1px solid rgba(255,255,255,0.95); border-radius: 3px;
      box-shadow: 0 0 6px rgba(0,0,0,0.5), inset 0 0 6px rgba(0,0,0,0.3);
      pointer-events: none; z-index: 26; opacity: 0;
    }
    #focusRing.show { animation: focusPulse 900ms ease-out forwards; }
    @keyframes focusPulse {
      0%   { opacity: 0; transform: scale(1.4); }
      25%  { opacity: 1; transform: scale(1); }
      70%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { #focusRing.show { animation: none; } }

    .frame-ticks { position: absolute; inset: 0; pointer-events: none; z-index: 24; }
    .frame-ticks i { position: absolute; width: 22px; height: 22px; border: 0 solid rgba(255,255,255,0.9); }
    .frame-ticks i:nth-child(1) { top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; }
    .frame-ticks i:nth-child(2) { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }
    .frame-ticks i:nth-child(3) { bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; }
    .frame-ticks i:nth-child(4) { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; }

    /* live detection overlay + chips */
    #liveOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 23; }
    .coach-cue {
      position: absolute; left: 50%; bottom: 16px;
      transform: translateX(-50%); display: none; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      padding: 8px 18px; border-radius: 100px; z-index: 27;
      pointer-events: none; white-space: nowrap;
    }
    .coach-cue.show { display: flex; }
    #coachText { font-size: 15px; color: #fff; font-weight: 600; }

    .status-chip { position: absolute; top: calc(56px + env(safe-area-inset-top)); left: 14px; z-index: 26; color: #fff; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 100px; display: none; background: rgba(0,0,0,0.5); }
    .status-chip.show { display: inline-block; }
    .status-chip.warn { background: rgba(200,90,60,0.9); }

    /* lens toggle (1× / 0.5×) */
    .lens-toggle { display: none; gap: 2px; background: rgba(255,255,255,0.10); border-radius: 100px; padding: 3px; }
    .lens-toggle.show { display: flex; }
    .lens-opt { color: rgba(255,255,255,0.7); font-size: 13px; padding: 5px 14px; border-radius: 100px; }
    .lens-opt.active { background: rgba(255,255,255,0.92); color: #1a1a1a; }

    /* capture gate */
    .gate-block { position: absolute; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: rgba(20,18,16,0.92); padding: 40px; text-align: center; }
    .gate-block.show { display: flex; }
    .gate-msg { color: #fff; font-size: 18px; line-height: 1.5; max-width: 320px; }

    /* loading */
    .loading { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,0.55); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
    .loading.active { display: flex; }
    .spinner { width: 52px; height: 52px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #fff; font-size: 15px; }

    /* tip panel (overlays live camera) */
    .tip-panel { width: 100%; display: none; }

    /* The one line of plain-English placement advice. */
    .place-hint {
      color: #fff; font-size: 15px; line-height: 1.35; text-align: center;
      padding: 2px 4px 10px; text-wrap: balance;
    }
    .place-hint:empty { display: none; }

    .take-photo { width: 100%; height: 46px; background: var(--accent); color: #fff; border: none; font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 100px; margin-bottom: 6px; }
    .take-photo:active { transform: scale(0.97); }
    .rescan { display: block; text-align: center; color: rgba(255,255,255,0.78); font-size: 13px; padding: 4px; }

    /* ─── Results ─── */
    #results { background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .results-inner { min-height: 100%; display: flex; flex-direction: column; }
    .photo-wrap {
      position: relative; width: 100%; background: #000; flex-shrink: 0;
      aspect-ratio: 3 / 4;
    }
    #resultPhoto { width: 100%; height: 100%; object-fit: contain; display: block; }
    .scene-badge { position: absolute; bottom: 14px; left: 14px; background: rgba(0,0,0,0.45); color: #fff; padding: 6px 16px; border-radius: 100px; font-size: 14px; font-weight: 600; }
    .filter-strip {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .filter-strip::-webkit-scrollbar { display: none; }
    .filter-opt {
      flex: 0 0 auto; padding: 7px 14px; border-radius: 100px; font-size: 13px;
      border: 1.5px solid var(--accent); color: var(--accent); background: transparent;
      font-family: inherit; white-space: nowrap;
    }
    .filter-opt.on { background: var(--accent); color: #fff; }
    /* A dot, not a label: it marks the model's choice without turning the row into a lecture. */
    .filter-opt.pick::after { content: ' ·'; font-weight: 700; }

    .cards { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--surface); border-radius: 14px; padding: 18px; box-shadow: var(--card-shadow); }
    .card-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
    .card-title .ch { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 10px; }
    .pills {
      display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 12px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .pills::-webkit-scrollbar { display: none; }
    .pill { flex: 0 0 auto; }
    .pill { background: var(--accent-tint); color: var(--accent); padding: 5px 14px; border-radius: 100px; font-size: 13px; font-weight: 500; }
    .pill:active { transform: scale(0.95); }
    .copy-all { font-size: 13px; color: var(--accent); font-weight: 500; }

    /* Deliberately the quietest thing on the screen: below the actions, no fill, no accent. */
    .tip-btn {
      background: none; border: none; font-family: inherit; font-size: 13px;
      color: var(--text2); padding: 4px 8px; text-decoration: underline;
      text-underline-offset: 3px;
    }
    /* A native sheet: the card rises from the bottom edge while the backdrop fades in behind it. */
    .sheet {
      position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end;
      background: rgba(0,0,0,0); padding: 0;
      transition: background 260ms ease;
    }
    .sheet.open { background: rgba(0,0,0,0.45); }
    .sheet-card {
      width: 100%; background: var(--surface); color: var(--text);
      border-radius: 20px 20px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px;
      transform: translateY(100%);
      transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet.open .sheet-card { transform: translateY(0); }
    /* The handle is decoration, but its absence is what makes a sheet read as a stuck panel. */
    .sheet-grabber {
      width: 36px; height: 5px; border-radius: 100px; background: var(--text2);
      opacity: 0.4; margin: 0 auto 6px;
    }
    @media (prefers-reduced-motion: reduce) {
      .sheet, .sheet-card { transition: none; }
    }
    .sheet-title { font-size: 19px; font-weight: 700; }
    .sheet-body { font-size: 14px; color: var(--text2); line-height: 1.5; }
    .tip-opt {
      width: 100%; height: 50px; border: 1px solid var(--accent); border-radius: 100px;
      background: none; color: var(--accent); font-family: inherit; font-size: 16px;
      font-weight: 600; margin-top: 4px;
    }
    .tip-opt[disabled] { opacity: 0.5; }
    .sheet-close {
      background: none; border: none; font-family: inherit; font-size: 14px;
      color: var(--text2); padding: 10px; margin-top: 4px;
    }
    .bottom { padding: 8px 16px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .btn { width: 100%; height: 52px; border: none; border-radius: 100px; font-family: inherit; font-size: 16px; font-weight: 600; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--bg); color: var(--accent); border: 1.5px solid var(--accent); }
    /* Retake sits beside Scan again rather than above it: both are "not done yet", and giving
       retake its own button would outweigh Share, which is still the point of the screen. */
    .after-shot { display: flex; gap: 24px; align-items: center; }
    .scan-again { font-size: 14px; color: var(--text2); padding: 6px; }
    #retakeBtn { color: var(--accent); font-weight: 600; }

    /* toast */
    .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 80%; text-align: center; }
    .toast.show { opacity: 1; }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <!-- ── Home ── -->
  <section id="home" class="screen active">
    <div class="theme-toggle" id="themeToggle">
      <button class="theme-opt" data-theme-choice="light" aria-label="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" /><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1" />
        </svg>
      </button>

  <!-- Channel-gain tints for the warm and cool grades. A colour matrix can scale red and blue

  <div class="toast" id="toast"></div>

  <script>
    const API = 'https://daka-backend-9bfz.onrender.com';

    /* ── Language ──────────────────────────────────────────────────────────────
       Two languages, one table, and a `tr(key)` everywhere a sentence is shown. The app was a
       Chinese-named product with an English interface, and the model took the hint: hashtags came
       back in Chinese on some scans and English on others, which reads as a bug whichever
       language you speak. The scan now sends `lang` and the model writes every free-text field in
       that one language.

       Two things deliberately do NOT move:
       - the 打卡吧！ wordmark — that is the logo, not copy. The 开始打卡 button used to be listed
         here with it, but it is the one control on the screen and a reader who cannot read it has
         nothing to press. A logo can be foreign; a button cannot;
       - filter names in FILTER_CSS — the server picks one by exact string, so they are keys;
       - text already on screen from a previous scan. The scene name and the standing hint were
         written by the model in the old language, and retranslating them would mean paying for
         another call to relabel a photo the user is already looking at. The next scan is in the
         new language, which is soon enough.

       English stays in the HTML as the shipped default, so a fault in this code leaves a working
       English page rather than one showing key names. */
    const LANGS = ['en', 'zh'];
    const STRINGS = {
      en: {
        'home.start': 'Start',
        'home.hint': 'Point at an empty scene to begin',

        'cam.shutterHint': 'Point at an empty scene and tap',
        'cam.takePhoto': 'Take Photo',
        'cam.scanAgain': 'Scan again',
        'cam.analysing': 'Analysing scene…',
        'cam.blocked': 'Camera blocked',
        'cam.blurry': 'Hold steady — blurry',
        'gate.light': 'Not enough light — find a brighter spot, then scan again.',
        'gate.blur': 'That shot was blurry — hold steady, then scan again.',

        'cue.stand': 'Have them stand on the marker',
        'cue.ready': 'Getting ready…',
        'cue.inFrame': 'Get them in frame',
        'cue.left': 'Move them left',
        'cue.right': 'Move them right',
        'cue.closer': 'Bring them closer',
        'cue.back': 'Send them back',
        'cue.straighten': 'Straighten the camera',
        'cue.perfect': 'Perfect — take the photo',

        // Keyed off camera_tilt.direction and placement.reason, so the engine keeps sending its
        // machine key and the phrasing is chosen here — no round trip to translate a fixed sentence
        // the client already knows.
        'tilt.up': 'Empty floor below — aim a little higher',
        'tilt.down': 'Empty space above — aim a little lower',
        'reason.backlight': 'Out of the window glare',
        'reason.light': 'Light falls on your face',
        'reason.balance': 'Balances the busy side',
        'reason.clean_background': 'Cleaner background here',
        'reason.default': 'Classic rule-of-thirds spot',

        'tip.open': 'Buy us a coffee',
        'tip.title': 'Buy us a coffee',
        'tip.body': 'DaKaBa is free and has no ads. If it got you a good photo, this helps keep the server on.',
        'tip.close': 'No thanks',
        'tip.thanks': 'Thank you so much',
        'tip.failed': 'That did not go through',
        'tip.supporter': 'Thanks for supporting DaKaBa',
        'res.share': 'Share',
        'res.save': 'Save',
        'res.saveFiltered': 'Save with filter',
        'res.retake': 'Retake',
        'res.hashtags': 'Hashtags',
        'res.tapToCopy': 'tap to copy',
        'res.copyAll': 'Copy all',
        'res.scene': 'Scene',

        'toast.copied': 'Copied!',
        'toast.allCopied': 'All copied!',
        'toast.tagsCopied': 'Hashtags copied — paste them into the caption',
        'toast.saved': 'Saved',
        'toast.copyFail': 'Copy failed',
        'toast.noCam': 'Camera unavailable — pick a photo instead',
        'toast.notReady': 'Camera not ready yet',
        'toast.ultra': '0.5× wide — keep your subject centred to avoid edge distortion',
        'toast.lensFail': 'Could not switch lens',

        'err.timeout': 'Server took too long — it may be waking up. Try again.',
        'err.generic': 'Analysis failed',
        'err.badResponse': 'Bad response from server',
        'err.server': 'Server error',
      },
      zh: {
        'home.start': '开始打卡',
        'home.hint': '对准一个没有人的场景即可开始',

        'cam.shutterHint': '对准空场景，轻点快门',
        'cam.takePhoto': '拍照',
        'cam.scanAgain': '重新扫描',
        'cam.analysing': '正在分析场景…',
        'cam.blocked': '镜头被挡住了',
        'cam.blurry': '拿稳一点 — 画面模糊',
        'gate.light': '光线不足 — 换个亮一点的地方，再扫描一次。',
        'gate.blur': '这张拍糊了 — 拿稳手机，再扫描一次。',

        'cue.stand': '让对方站到标记上',
        'cue.ready': '正在准备…',
        'cue.inFrame': '让对方进入画面',
        'cue.left': '让对方往左一点',
        'cue.right': '让对方往右一点',
        'cue.closer': '让对方走近一点',
        'cue.back': '让对方退后一点',
        'cue.straighten': '把手机端正',
        'cue.perfect': '很好 — 可以拍了',

        'tilt.up': '下方地面太空 — 镜头抬高一点',
        'tilt.down': '上方留白太多 — 镜头放低一点',
        'reason.backlight': '避开窗外的强光',
        'reason.light': '光线正好打在脸上',
        'reason.balance': '平衡较杂乱的一侧',
        'reason.clean_background': '这里背景更干净',
        'reason.default': '经典的三分线位置',

        'tip.open': '请我们喝杯咖啡',
        'tip.title': '请我们喝杯咖啡',
        'tip.body': '打卡吧是免费的，也没有广告。如果它帮你拍到了好照片，这能帮我们维持服务器。',
        'tip.close': '暂时不用',
        'tip.thanks': '非常感谢！',
        'tip.failed': '支付没有完成',
        'tip.supporter': '感谢你支持打卡吧',
        'res.share': '分享',
        'res.save': '保存',
        'res.saveFiltered': '保存（含滤镜）',
        'res.retake': '再拍一张',
        'res.hashtags': '话题标签',
        'res.tapToCopy': '点击复制',
        'res.copyAll': '全部复制',
        'res.scene': '场景',

        'toast.copied': '已复制！',
        'toast.allCopied': '已全部复制！',
        'toast.tagsCopied': '标签已复制 — 粘贴到文案里即可',
        'toast.saved': '已保存',
        'toast.copyFail': '复制失败',
        'toast.noCam': '无法使用相机 — 请改从相册选一张',
        'toast.notReady': '相机还没准备好',
        'toast.ultra': '0.5× 超广角 — 让人物靠中间，避免边缘变形',
        'toast.lensFail': '无法切换镜头',

        'err.timeout': '服务器响应太慢 — 可能正在唤醒，请再试一次。',
        'err.generic': '分析失败',
        'err.badResponse': '服务器返回异常',
        'err.server': '服务器错误',
      },
    };

    const FILTER_LABELS = {
      zh: {
        'Original': '原图',
        'Vivid': '鲜艳',
        'Vivid Warm': '鲜艳暖调',
        'Vivid Cool': '鲜艳冷调',
        'Dramatic': '浓郁',
        'Dramatic Warm': '浓郁暖调',
        'Dramatic Cool': '浓郁冷调',
        'Silvertone': '银调黑白',
        'Noir': '硬黑白',
      },
    };

    let lang = (() => {
      // Saved choice first, then the phone's own language, then English. localStorage throws
      // outright in a locked-down private window, so it is never read without a guard.
      try {
        const saved = localStorage.getItem('daka.lang');
        if (LANGS.indexOf(saved) !== -1) return saved;
      } catch (e) { /* storage unavailable — fall through to the device language */ }
      return String((typeof navigator !== 'undefined' && navigator.language) || 'en')
        .toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    })();

    function trOr(key, fallback) {
      return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || fallback;
    }
    function tr(key) { return trOr(key, key); }
    function filterLabel(name) { return (FILTER_LABELS[lang] || {})[name] || name; }

    const FILTER_CSS = {
      'Vivid':         'saturate(1.35) contrast(1.12)',
      'Vivid Warm':    'url(#warmTint) saturate(1.30) contrast(1.1)',
      'Vivid Cool':    'url(#coolTint) saturate(1.25) contrast(1.1) brightness(1.02)',
      'Dramatic':      'contrast(1.3) saturate(0.9) brightness(0.95)',
      'Dramatic Warm': 'url(#warmTint) contrast(1.3) saturate(1.0) brightness(0.96)',
      'Dramatic Cool': 'url(#coolTint) contrast(1.32) saturate(0.92) brightness(0.96)',
      'Silvertone':    'grayscale(1) sepia(0.25) contrast(1.05) brightness(1.05)',
      'Noir':          'grayscale(1) contrast(1.45) brightness(0.92)',
    };

    const TINT = { '#warmTint': 0.06, '#coolTint': -0.05 };

    /* ── State ── */
    let stream = null;
    let analysisResult = null;  // result from the scene scan
    let capturedImg = null;     // the keeper photo (full-res Image)
    let currentFilter = 'Vivid';
    let filterActive = false;
    let hasCamera = false;
    let ultraDeviceId = null, currentLens = 'wide', ultraAvailable = false;

    const $ = (id) => document.getElementById(id);
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
    }
    let toastTimer;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function scaledSize(w, h, cap) { const m = Math.max(w, h); if (m <= cap) return [w, h]; const r = cap / m; return [Math.round(w*r), Math.round(h*r)]; }
    function errMsg(e) { return e.name === 'AbortError' ? tr('err.timeout') : (e.message || tr('err.generic')); }

    /* ── Coaching state ──
       standPos is where the SUBJECT stands IN FRAME, not a point to aim the camera at. */
    let coachingActive = false;
    // camera_tilt, kept as the engine sent it rather than as a finished sentence: the language can
    // change after the scan, and a pre-resolved string would keep the language it was scanned in.
    let tiltDirection = null;      // camera_tilt.direction, once it is something other than "ok"
    let tiltFallback = '';         // camera_tilt.reason, for a direction this client cannot phrase
    let standPos = null;           // {x, y} from analysis.placement — where the subject stands

    /* ── Subject detection (MediaPipe pose, lazy-loaded) ──
       Ankles, not the body centre: the marker is a footprint. */
    const tracker = { landmarker: null, loading: false, failed: false };
    const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    async function loadTracker() {
      if (tracker.landmarker || tracker.loading || tracker.failed) return;
      tracker.loading = true;
      try {
        const vision = await import(MP);
        const fileset = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
        const opts = (delegate) => ({
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/' +
                            'pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
            delegate,
          },
          runningMode: 'VIDEO',
          numPoses: 1,
          // Defaults are 0.5, which is tuned for "find the person" rather than "is there one".
          minPoseDetectionConfidence: 0.7,
          minPosePresenceConfidence: 0.7,
          minTrackingConfidence: 0.7,
        });
        try { tracker.landmarker = await vision.PoseLandmarker.createFromOptions(fileset, opts('GPU')); }
        catch (e) { tracker.landmarker = await vision.PoseLandmarker.createFromOptions(fileset, opts('CPU')); }
      } catch (e) {
        tracker.failed = true;      // no subject cues; the rest of the app is unaffected
      } finally {
        tracker.loading = false;
      }
    }

    // Smoothed subject position, in CROP coordinates.
    const subject = { x: 0.5, y: 0.66, seen: false, lostAt: 0 };
    let lastDetect = 0;
    // ~10fps detection, so three frames is about a third of a second — long enough to reject a one-
    // frame flicker, short enough that nobody notices the wait.
    const CONFIRM_FRAMES = 3;
    let streak = 0;

    const _det = document.createElement('canvas');
    const DETECT_WIDTH = 480;

    function detectFrame(video) {
      const h = Math.max(1, Math.round(DETECT_WIDTH * video.videoHeight / video.videoWidth));
      if (_det.width !== DETECT_WIDTH || _det.height !== h) { _det.width = DETECT_WIDTH; _det.height = h; }
      _det.getContext('2d').drawImage(video, 0, 0, DETECT_WIDTH, h);
      return _det;
    }

    function detectSubject(video, ts) {
      if (!tracker.landmarker || !video.videoWidth) return;
      if (ts - lastDetect < 100) return;
      lastDetect = ts;

      let res;
      try { res = tracker.landmarker.detectForVideo(detectFrame(video), ts); }
      catch (e) {
        // Once, not every frame: this runs ten times a second and a repeating log is unreadable.
        if (!detectSubject.warned) { detectSubject.warned = true; console.error('pose detection:', e); }
        return;
      }
      const poses = (res && res.landmarks) || [];
      if (!poses.length) {
        streak = 0;
        if (!subject.lostAt) subject.lostAt = ts;
        if (ts - subject.lostAt > 600) subject.seen = false;   // brief dropouts are not "gone"
        return;
      }
      subject.lostAt = 0;

      const lm = poses[0];
      const mid = (a, b) => (a && b) ? { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } : null;
      // ankles -> hips -> nose: the best available stand-in for "where they are standing"
      const feet = mid(lm[27], lm[28]) || mid(lm[23], lm[24]) || lm[0];
      if (!feet) return;

      const vis = (i) => (lm[i] && typeof lm[i].visibility === 'number') ? lm[i].visibility : 1;
      const legsSeen = Math.max(vis(27), vis(28), vis(25), vis(26)) > 0.6;
      const torsoSeen = Math.max(vis(11), vis(12)) > 0.6;
      const head = lm[0] || lm[11];
      const tall = head ? (feet.y - head.y) > 0.20 : false;

      if (!(legsSeen && torsoSeen && tall)) {
        streak = 0;
        if (!subject.lostAt) subject.lostAt = ts;
        if (ts - subject.lostAt > 600) subject.seen = false;
        return;
      }

      // Landmarks are normalised to the FULL video frame, but the marker lives in the visible crop.
      const c = visibleCrop(video);
      const cx = (feet.x * video.videoWidth - c.sx) / c.sw;
      const cy = (feet.y * video.videoHeight - c.sy) / c.sh;
      if (!isFinite(cx) || !isFinite(cy)) return;

      streak += 1;
      if (streak < CONFIRM_FRAMES) return;

      if (!subject.seen) { subject.x = cx; subject.y = cy; }
      subject.x += (cx - subject.x) * 0.35;
      subject.y += (cy - subject.y) * 0.35;
      subject.seen = true;
    }

    let standReason = '';          // placement.reason_text — why the engine picked that spot
    let needsStraightening = false;// the scanned frame had a crooked horizon
    let onMarker = false;          // is someone standing on the spot right now
    let liveLean = 0;

    /* ── Camera state (idle | loading | tips) ── */
    let barRelease = null;
    function releaseBar(el) {
      clearTimeout(barRelease);
      // Comfortably past the 340ms transition. transitionend alone is not enough: reduced-motion
      // removes the transition entirely, so the event would never fire and the pin would stay.
      barRelease = setTimeout(() => { el.style.height = ''; }, 420);
    }

    function resizeControls(from) {
      const el = $('camControls');
      clearTimeout(barRelease);
      el.style.height = 'auto';
      const to = el.getBoundingClientRect().height;
      if (!to) { el.style.height = ''; return; }      // not laid out yet — leave it alone
      if (!from || Math.abs(to - from) < 1) { el.style.height = ''; return; }
      el.style.height = from + 'px';
      void el.offsetHeight;                            // flush the start value, or there is no
      el.style.height = to + 'px';                     // transition to animate from
      releaseBar(el);
    }
    // An explicit pixel height goes stale when the screen changes shape.
    window.addEventListener('resize', () => { $('camControls').style.height = ''; });

    let frameShift = 0;

    // Analysing centres the frame in the screen; everything else leaves it where the flow puts it,
    // which is the top-middle position the composing and coaching states share.
    function placeFrame(centred) {
      const frame = $('camFrame');
      const r = frame.getBoundingClientRect();
      if (!r.height) { return; }                 // not laid out yet — nothing to place
      const natural = r.top - frameShift;
      // The section is position:fixed inset:0, so its box is the visual viewport — innerHeight lies
      // on iOS while the URL bar is sliding.
      const screenH = $('camera').getBoundingClientRect().height || r.height;
      frameShift = centred ? Math.max(0, (screenH - r.height) / 2) - natural : 0;
      frame.style.transform = frameShift ? 'translateY(' + Math.round(frameShift) + 'px)' : '';
    }

    function setCamState(s) {
      // Measured BEFORE the panels change, because this is the height we are animating FROM.
      const from = $('camControls').getBoundingClientRect().height;
      $('camIdle').style.display     = s === 'idle' ? 'flex' : 'none';
      $('camLoading').classList.toggle('active', s === 'loading');
      const tips = s === 'tips';
      $('gridOverlay').style.display = tips ? 'block' : 'none';
      $('sceneBadgeTop').style.display = tips ? 'block' : 'none';
      $('tipPanel').style.display    = tips ? 'block' : 'none';
      $('camLevel').style.display    = tips ? 'block' : 'none';  // no level/tilt on the initial scan
      updateLensVisibility();
      if (s !== 'tips') resetCoaching();
      // Last: resetCoaching clears the placement hint, which is part of what is being measured.
      if (s === 'loading') { clearTimeout(barRelease); if (from) $('camControls').style.height = from + 'px'; }
      else resizeControls(from);
      placeFrame(s === 'loading');
    }

    async function startCamera() {
      await requestMotion();     // must precede getUserMedia — see requestMotion
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2880 }, frameRate: { ideal: 30 } }, audio: false });
        $('video').srcObject = stream;
        $('videoBackdrop').srcObject = stream;   // same stream, so they can never disagree
        hasCamera = true;
        show('camera');
        setCamState('idle');
        detectLenses();
        loadTracker();          // in the background, so it is ready by the time they scan
        startLive();
      } catch (e) {
        hasCamera = false;
        toast(tr('toast.noCam'));
        $('fileInput').click();
      }
    }

    async function resumeCamera() {
      const live = !!stream && stream.getVideoTracks().some(t => t.readyState === 'live');
      if (!live) { await startCamera(); return 'reacquired'; }
      for (const id of ['video', 'videoBackdrop']) {
        const v = $(id);
        if (v.srcObject !== stream) v.srcObject = stream;
        // play() rejects if the element is not ready yet.
        try { const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* not ready */ }
      }
      return 'resumed';
    }

    /* ── 1×/0.5× ultra-wide lens (feature-detected) ── */
    function updateLensVisibility() { $('lensToggle').classList.toggle('show', ultraAvailable && $('camIdle').style.display === 'flex'); }
    async function detectLenses() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter(d => d.kind === 'videoinput');
        const ultra = vids.find(d => /ultra|0\.5/i.test(d.label) && /back|rear|environment/i.test(d.label))
                   || vids.find(d => /ultra/i.test(d.label));
        if (ultra) { ultraDeviceId = ultra.deviceId; ultraAvailable = true; }
      } catch (e) { /* labels need camera permission — leave the toggle hidden */ }
      updateLensVisibility();
    }
    async function switchLens(lens) {
      if (lens === currentLens) return;
      const constraints = (lens === 'ultra' && ultraDeviceId)
        ? { video: { deviceId: { exact: ultraDeviceId }, width: { ideal: 3840 }, height: { ideal: 2880 }, frameRate: { ideal: 30 } }, audio: false }
        : { video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2880 }, frameRate: { ideal: 30 } }, audio: false };
      try {
        const ns = await navigator.mediaDevices.getUserMedia(constraints);
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = ns; $('video').srcObject = ns; $('videoBackdrop').srcObject = ns; currentLens = lens;
        document.querySelectorAll('.lens-opt').forEach(o => o.classList.toggle('active', o.dataset.lens === lens));
        if (lens === 'ultra') toast(tr('toast.ultra'));
      } catch (e) { toast(tr('toast.lensFail')); }
    }
    document.querySelectorAll('.lens-opt').forEach(o => o.addEventListener('click', () => switchLens(o.dataset.lens)));

    /* ── Live scene guards (blur / blocked) ── */
    let liveActive = false, liveRAF = null, lastCheck = 0;
    const _fs = document.createElement('canvas'); _fs.width = 64; _fs.height = 64;

    /* ── Tap to focus ── */
    // The camera wants the point in track coordinates, not screen ones. The video is
    // object-fit: cover, a 4:3 track inside a 3:4 frame, so a fifth of its width is off screen on
    // each side. Hand it the raw fraction of the element and it focuses somewhere you cannot see.
    function focusPoint(el, video, clientX, clientY) {
      const box = el.getBoundingClientRect();
      if (!box.width || !box.height || !video.videoWidth) return null;
      const scale = Math.max(box.width / video.videoWidth, box.height / video.videoHeight);
      const shownW = video.videoWidth * scale, shownH = video.videoHeight * scale;
      const localX = clientX - box.left, localY = clientY - box.top;
      return {
        x: (localX + (shownW - box.width) / 2) / shownW,
        y: (localY + (shownH - box.height) / 2) / shownH,
        localX, localY
      };
    }

    // pointsOfInterest is an image-capture extension Chromium ships and WebKit does not, so on an
    // iPhone this is false and the tap does nothing at all. No reticle either: an animation over a
    // lens that never moved is a control pretending to work.
    function focusModes(track) {
      const supported = navigator.mediaDevices && navigator.mediaDevices.getSupportedConstraints
        ? navigator.mediaDevices.getSupportedConstraints() : {};
      if (!supported.pointsOfInterest || !track || !track.getCapabilities) return null;
      let modes;
      try { modes = track.getCapabilities().focusMode; } catch (e) { return null; }
      return (modes && modes.length) ? modes : null;
    }

    async function tapToFocus(event) {
      const track = stream && stream.getVideoTracks()[0];
      const modes = focusModes(track);
      if (!modes) return;
      const point = focusPoint($('camFrame'), $('video'), event.clientX, event.clientY);
      if (!point) return;

      // single-shot focuses once and holds, which is what a tap means. Where only continuous is
      // offered the point still steers it, so take whichever the camera actually has.
      const mode = modes.includes('single-shot') ? 'single-shot'
        : modes.includes('continuous') ? 'continuous' : modes[0];
      try {
        await track.applyConstraints({
          advanced: [{ focusMode: mode, pointsOfInterest: [{ x: point.x, y: point.y }] }]
        });
      } catch (e) { return; }   // rejected: nothing focused, so nothing to draw

      const ring = $('focusRing');
      ring.style.left = point.localX + 'px';
      ring.style.top = point.localY + 'px';
      ring.classList.remove('show');
      void ring.offsetWidth;    // restart the animation when the same spot is tapped twice
      ring.classList.add('show');
    }

    $('camFrame').addEventListener('click', tapToFocus);

    /* ── Coaching helpers ── */
    function setCue(text) {
      const el = $('coachCue');
      if (!text) { el.classList.remove('show'); return; }
      $('coachText').textContent = text;
      el.classList.add('show');
    }

    function drawStandMarker(W, H, ctx, x, y, green, label) {
      const fx = x * W, fy = y * H;
      const rw = 0.09 * H, rh = 0.028 * H, hw = rw * 0.9, boxH = 0.72 * H;
      ctx.save();
      ctx.strokeStyle = green ? 'rgba(102,187,106,0.9)' : 'rgba(197,122,82,0.9)';
      ctx.fillStyle = green ? 'rgba(102,187,106,0.22)' : 'rgba(197,122,82,0.18)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(fx, fy, rw, rh, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.setLineDash([7, 7]); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(fx - hw, fy); ctx.lineTo(fx - hw, fy - boxH);
      ctx.moveTo(fx + hw, fy); ctx.lineTo(fx + hw, fy - boxH);
      ctx.moveTo(fx - hw, fy - boxH); ctx.lineTo(fx + hw, fy - boxH);
      ctx.stroke();
      ctx.restore();

      if (label) {
        ctx.save();
        ctx.font = '600 ' + Math.max(12, Math.round(H * 0.021)) + 'px Georgia, "Noto Serif SC", serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 6;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        const halfText = ctx.measureText(label).width / 2 + 10;
        const lx = Math.min(W - halfText, Math.max(halfText, fx));

        // The cue pill sits at the bottom of the viewfinder and is roughly 37px tall, so a caption
        // below this line is hidden behind it.
        const font = Math.max(12, Math.round(H * 0.021));
        const cueTop = H - CUE_RESERVED_PX;
        if (fy + rh + 10 + font <= cueTop) {
          ctx.textBaseline = 'top';
          ctx.fillText(label, lx, fy + rh + 10);
        } else {
          ctx.textBaseline = 'bottom';
          ctx.fillText(label, lx, fy - rh - 10);
        }
        ctx.restore();
      }
    }

    function coverTF(video, canvas) {
      const W = canvas.clientWidth, H = canvas.clientHeight; canvas.width = W; canvas.height = H;
      const vw = video.videoWidth || W, vh = video.videoHeight || H;
      const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
      return { W, H, vw, vh, PX: n => ox + n * dw, PY: n => oy + n * dh, SX: n => n * dw, SY: n => n * dh };
    }

    function frameStats(video) {
      const ctx = _fs.getContext('2d'); ctx.drawImage(video, 0, 0, 64, 64);
      const d = ctx.getImageData(0, 0, 64, 64).data;
      const lum = new Float32Array(64 * 64); let sum = 0;
      for (let i = 0, j = 0; i < d.length; i += 4, j++) { const L = 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2]; lum[j] = L; sum += L; }
      const brightness = sum / (64 * 64);
      let grad = 0, n = 0;                                 // horizontal high-frequency energy → sharpness proxy
      for (let y = 0; y < 64; y++) for (let x = 1; x < 64; x++) { grad += Math.abs(lum[y*64+x] - lum[y*64+x-1]); n++; }
      const detail = grad / n;
      return { brightness, detail };
    }

    function startLive() { if (liveActive) return; liveActive = true; liveLoop(performance.now()); }
    function resetCoaching() {
      coachingActive = false; standPos = null; standReason = '';
      // Stale advice is worse than none: without this, a failed rescan leaves the PREVIOUS scene's
      // instruction sitting above the shutter, describing a scene you have walked away from.
      const hint = $('placeHint'); if (hint) hint.textContent = '';
      subject.seen = false; subject.lostAt = 0; onMarker = false; streak = 0;
      tiltDirection = null; tiltFallback = ''; needsStraightening = false;
      $('camLevel').classList.remove('needs-fix');
      setCue(null);
    }
    function stopLive() {
      liveActive = false; if (liveRAF) cancelAnimationFrame(liveRAF); liveRAF = null;
      const cv = $('liveOverlay'); if (cv.width) cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
      $('statusChip').classList.remove('show');
      resetCoaching();
    }
    function liveLoop(ts) {
      if (!liveActive) return;
      liveRAF = requestAnimationFrame(liveLoop);
      const video = $('video'); if (!video.videoWidth) return;
      const cv = $('liveOverlay'), tf = coverTF(video, cv), ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, tf.W, tf.H);

      // scene guards (~3×/sec)
      const now = performance.now();
      if (now - lastCheck > 300) {
        lastCheck = now;
        const st = frameStats(video);
        let msg = '';
        if (st.brightness < 22 || st.detail < 1.3) msg = tr('cam.blocked');
        else if (st.detail < 3.2) msg = tr('cam.blurry');
        const s = $('statusChip');
        if (msg) { s.textContent = msg; s.classList.add('show', 'warn'); }
        else s.classList.remove('show');
      }

      // ── coaching overlay: subject first, then position, then the camera ──
      // Wrapped: one throw in the drawing half used to take setCue with it, freezing every cue.
      try {
      if (coachingActive && standPos) {
        detectSubject(video, ts);

        // Hysteresis: it takes less to stay on the marker than to get there, so someone standing
        // still on the edge of the zone does not flicker between two cues.
        const dx = subject.x - standPos.x;
        const dy = subject.y - standPos.y;
        const limit = onMarker ? 0.13 : 0.09;
        // Asymmetric, because the frame is.
        const slack = onMarker ? 0.04 : 0;
        const tooFar = dy <= -(0.12 + slack);     // feet HIGHER in frame = further away
        const tooNear = dy >= (0.06 + slack);     // feet LOWER in frame = closer to the camera
        onMarker = subject.seen && Math.abs(dx) < limit && !tooFar && !tooNear;

        // Latch off once they have actually levelled up, so a later wobble does not start nagging
        // again.
        if (needsStraightening && Math.abs(liveLean) <= 3) needsStraightening = false;

        drawStandMarker(tf.W, tf.H, ctx, standPos.x, standPos.y, onMarker, standReason);
        $('camLevel').classList.toggle('needs-fix', onMarker && needsStraightening);

        // One cue at a time, in the order the work actually happens: get someone in shot, get them
        // on the spot, then fine-tune the camera.
        if (tracker.failed || !tracker.landmarker) {
          setCue(tracker.failed ? tr('cue.stand') : tr('cue.ready'));
        } else if (!subject.seen) {
          setCue(tr('cue.inFrame'));
        } else if (Math.abs(dx) >= limit) {
          // "them", not "you": the reader is holding the phone, and everything they are told to do
          // themselves (straighten, aim) is phrased that way too.
          setCue(dx > 0 ? tr('cue.left') : tr('cue.right'));
        } else if (tooFar || tooNear) {
          // Feet higher in frame than the marker means further away, and vice versa.
          setCue(tooFar ? tr('cue.closer') : tr('cue.back'));
        } else if (needsStraightening) {
          setCue(tr('cue.straighten'));
        } else if (tiltDirection) {
          setCue(trOr('tilt.' + tiltDirection, tiltFallback));
        } else {
          setCue(tr('cue.perfect'));
        }
      }
      } catch (err) {
        if (!liveLoop.warned) { liveLoop.warned = true; console.error('coaching overlay:', err); }
        setCue(tr('cue.stand'));   // degrade to the static prompt, keep shooting
      }
    }

    function openGate(msg) { $('camLoading').classList.remove('active'); $('gateMsg').textContent = msg; $('gateBlock').classList.add('show'); }
    function closeGate() { $('gateBlock').classList.remove('show'); setCamState('idle'); }

    /* ── Frame grabbing ── */
    function visibleCrop(video) {
      const boxW = video.clientWidth || window.innerWidth;
      const boxH = video.clientHeight || window.innerHeight;
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.max(boxW / vw, boxH / vh);          // matches object-fit: cover
      const sw = Math.min(vw, Math.round(boxW / scale));
      const sh = Math.min(vh, Math.round(boxH / scale));
      return { sx: Math.round((vw - sw) / 2), sy: Math.round((vh - sh) / 2), sw, sh };
    }

    function grabScanBlob() {
      const v = $('video'); if (!v.videoWidth) return null;
      const c = visibleCrop(v);
      const [w, h] = scaledSize(c.sw, c.sh, 1024);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(v, c.sx, c.sy, c.sw, c.sh, 0, 0, w, h);
      return new Promise(r => cv.toBlob(b => r(b), 'image/jpeg', 0.7));
    }
    // Deliberately NOT using ImageCapture.takePhoto().
    async function grabKeeperURL() {
      const v = $('video'); if (!v.videoWidth) return null;
      const c = visibleCrop(v);                        // same crop the user framed
      // 5000 is above the largest mode any phone will hand back for a video track, so this no
      // longer binds — it is a guard against an absurd sensor, not a resolution policy.
      const [w, h] = scaledSize(c.sw, c.sh, 5000);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(v, c.sx, c.sy, c.sw, c.sh, 0, 0, w, h);
      return new Promise(r => cv.toBlob(b => r(b ? URL.createObjectURL(b) : null), 'image/jpeg', 0.95));
